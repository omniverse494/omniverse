<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE CORE | Streaming Hub</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-main: #060709;
            --bg-panel: #11131a;
            --accent: #ff4757;
            --text-main: #ffffff;
            --text-muted: #a4b0be;
            --border-color: #222530;
            --input-bg: #000000;
        }
        [data-theme="light"] {
            --bg-main: #f1f2f6;
            --bg-panel: #ffffff;
            --accent: #eb4d4b;
            --text-main: #1e272e;
            --text-muted: #57606f;
            --border-color: #ced6e0;
            --input-bg: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); padding-bottom: 160px; overflow-x: hidden; transition: background 0.2s, color 0.2s; }
        
        .top-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); z-index: 999; }
        .logo { font-weight: 900; color: var(--accent); letter-spacing: 2px; font-size: 1.3rem; }
        .view-section { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .view-section.active { display: block; }

        .search-box { width: 100%; padding: 14px 18px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; }
        .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .f-btn { background: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .f-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
        .media-card { background: var(--bg-panel); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; cursor: pointer; }
        .media-card img { width: 100%; aspect-ratio: 11/16; object-fit: cover; }
        .media-card-info { padding: 12px; font-size: 0.8rem; }
        .media-title { font-weight: 700; line-height: 1.3; max-height: 2.6em; overflow: hidden; }

        .chat-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .chat-layout { grid-template-columns: 280px 1fr; } }
        .chat-channels-bar { display: flex; flex-direction: column; gap: 10px; }
        .room-toggle-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; cursor: pointer; font-weight: bold; }
        .room-toggle-card.active { border-color: var(--accent); }
        .user-list { background: var(--bg-panel); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); max-height: 320px; overflow-y: auto; }
        .online-user { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 5px; background: rgba(255,255,255,0.01); }
        
        .chat-main { background: var(--bg-panel); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { height: 380px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .msg-bubble { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; max-width: 80%; width: fit-content; }
        .msg-bubble.self { align-self: flex-end; border-color: var(--accent); }
        .chat-controls { display: flex; padding: 12px; gap: 10px; }
        .chat-controls input { flex: 1; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; }

        .identity-lockout { background: rgba(6,7,9,0.96); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .profile-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px; text-align: center; }
        .action-btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }

        .spotify-container { display: flex; flex-direction: column; gap: 8px; }
        .track-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-panel); padding: 14px 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        
        .master-player { position: fixed; bottom: 70px; left: 0; right: 0; background: var(--bg-panel); border-top: 2px solid var(--accent); padding: 15px 30px; z-index: 998; display: flex; justify-content: space-between; align-items: center; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-panel); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border-color); z-index: 1000; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; width: 80px; }
        .nav-btn.active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>
    <div id="identity-interceptor" class="identity-lockout">
        <div class="profile-card" style="max-width:400px; width:100%;">
            <h2 style="margin-bottom: 10px; color: var(--accent);">Setup Identity</h2>
            <input type="text" id="lockout-username-field" class="search-box" style="text-align:center;" placeholder="Enter Nickname...">
            <button class="action-btn" onclick="saveGatekeeperIdentity()">Launch App System</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="logo">● OMNIVERSE CORE</div>
        <button class="f-btn" onclick="toggleThemeCore()">Theme Switch</button>
    </div>

    <div id="home-view" class="view-section active">
        <input type="text" id="media-search" class="search-box" placeholder="🔍 Filter Anime/Manga..." oninput="filterMediaMatrix()">
        <div id="media-grid-display" class="grid"></div>
    </div>

    <div id="chat-view" class="view-section">
        <div class="chat-layout">
            <div class="chat-channels-bar">
                <div onclick="switchToGlobalRoom()" id="global-room-tab" class="room-toggle-card active">🌐 Global Chat</div>
                <div id="pm-users-list" class="user-list"></div>
            </div>
            <div class="chat-main">
                <div id="active-chat-header" style="padding:14px; color:var(--accent);">Active: Public Global</div>
                <div class="chat-messages" id="chat-messages-container"></div>
                <div class="chat-controls">
                    <input type="text" id="chat-message-input" placeholder="Type a message...">
                    <button class="action-btn" style="width:auto;" onclick="sendOmniChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="audio-view" class="view-section">
        <div id="spotify-tracks-container" class="spotify-container"></div>
    </div>

    <div class="master-player">
        <div id="player-track-title">No Audio Loaded</div>
        <button class="f-btn" id="audio-play-pause-btn" onclick="toggleAudioEngineState()">Play/Pause</button>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="routeTo('home', this)"><span>Home</span></button>
        <button class="nav-btn" onclick="routeTo('chat', this)"><span>Chat</span></button>
        <button class="nav-btn" onclick="routeTo('audio', this)"><span>Music</span></button>
    </div>

    <audio id="hardware-audio-streamer"></audio>
    <script>
        const firebaseConfig = { databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let localProfileName = localStorage.getItem('omni_v3_name') || "";
        let targetChatRoom = "Global";
        let mediaCacheBlock = [];

        function verifyIdentityRequirements() {
            if (localProfileName) {
                document.getElementById('identity-interceptor').style.display = 'none';
                database.ref('users/' + localProfileName).set({ heartbeat: Date.now() });
            } else {
                document.getElementById('identity-interceptor').style.display = 'flex';
            }
        }

        function saveGatekeeperIdentity() {
            const nameInput = document.getElementById('lockout-username-field').value.trim();
            if(!nameInput) return alert("Username required.");
            localProfileName = nameInput;
            localStorage.setItem('omni_v3_name', localProfileName);
            verifyIdentityRequirements();
        }

        function routeTo(viewId, element) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId + '-view').classList.add('active');
            element.classList.add('active');
        }

        function startLiveChatRouter() {
            database.ref('global_broadcast_messages').limitToLast(50).on('value', snap => {
                if(targetChatRoom === "Global") renderChatBubbles(snap.val());
            });
            database.ref('users').on('value', snap => {
                const users = snap.val() || {};
                const pmBox = document.getElementById('pm-users-list');
                pmBox.innerHTML = '';
                for(let u in users) {
                    if(u !== localProfileName) {
                        pmBox.innerHTML += `<div class="online-user" onclick="switchToPrivateMessage('${u}')">👤 ${u}</div>`;
                    }
                }
            });
        }

        function switchToGlobalRoom() {
            targetChatRoom = "Global";
            document.getElementById('active-chat-header').innerText = "Channel: Global Room";
            database.ref('global_broadcast_messages').limitToLast(50).once('value', s => renderChatBubbles(s.val()));
        }

        function switchToPrivateMessage(userTarget) {
            targetChatRoom = userTarget;
            document.getElementById('active-chat-header').innerText = `PM: @${userTarget}`;
            const tunnel = [localProfileName, userTarget].sort().join("_pmchannel_");
            database.ref('private_tunnels/' + tunnel).limitToLast(50).on('value', snap => {
                if(targetChatRoom === userTarget) renderChatBubbles(snap.val());
            });
        }

        function renderChatBubbles(data) {
            const container = document.getElementById('chat-messages-container');
            container.innerHTML = '';
            if(!data) return;
            for(let k in data) {
                const isSelf = data[k].sender === localProfileName ? 'self' : '';
                container.innerHTML += `<div class="msg-bubble ${isSelf}"><strong>${data[k].sender}:</strong> ${data[k].text}</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function sendOmniChatMessage() {
            const input = document.getElementById('chat-message-input');
            if(!input.value.trim()) return;
            const packet = { sender: localProfileName, text: input.value.trim(), epochTime: Date.now() };
            if(targetChatRoom === "Global") {
                database.ref('global_broadcast_messages').push(packet);
            } else {
                const tunnel = [localProfileName, targetChatRoom].sort().join("_pmchannel_");
                database.ref('private_tunnels/' + tunnel).push(packet);
            }
            input.value = '';
        }

        async function fetchJikanCloudFeeds() {
            try {
                const res = await (await fetch('https://api.jikan.moe/v4/top/anime?limit=12')).json();
                mediaCacheBlock = res.data;
                filterMediaMatrix();
            } catch(e) {}
        }

        function filterMediaMatrix() {
            const searchKeyword = document.getElementById('media-search').value.toLowerCase();
            const grid = document.getElementById('media-grid-display');
            let dataset = mediaCacheBlock.filter(item => item.title.toLowerCase().includes(searchKeyword));
            grid.innerHTML = dataset.map(item => `
                <div class="media-card">
                    <img src="${item.images.jpg.image_url}">
                    <div class="media-card-info"><div class="media-title">${item.title}</div></div>
                </div>
            `).join('');
        }

        const trackDatabase = [
            { title: "Metamorphosis Phonk Track", stream: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "Raining In Manila - Lola Amour", stream: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" }
        ];
        const audioCoreNode = document.getElementById('hardware-audio-streamer');

        function renderSpotifyLayout() {
            document.getElementById('spotify-tracks-container').innerHTML = trackDatabase.map((t, idx) => `
                <div class="track-row">
                    <span>🎵 ${t.title}</span>
                    <button class="f-btn" onclick="bootAudioTrack(${idx})">PLAY</button>
                </div>
            `).join('');
        }

        function bootAudioTrack(index) {
            audioCoreNode.src = trackDatabase[index].stream;
            audioCoreNode.play();
            document.getElementById('player-track-title').innerText = "Streaming: " + trackDatabase[index].title;
        }

        function toggleAudioEngineState() {
            if(audioCoreNode.paused) audioCoreNode.play(); else audioCoreNode.pause();
        }

        function toggleThemeCore() {
            document.body.toggleAttribute('data-theme');
        }

        document.addEventListener('DOMContentLoaded', () => {
            verifyIdentityRequirements();
            startLiveChatRouter();
            fetchJikanCloudFeeds();
            renderSpotifyLayout();
        });
    </script>
</body>
</html>
