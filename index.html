<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="s1LpdFQDsO-k3mGLHAsP62N2V955khk8kZsyeon9G1M" />
    <title>OMNIVERSE | Global Anime & Manga Authority</title>

    <style>
        :root { --bg: #0D0D0D; --panel: #1A1A1A; --text: #FFFFFF; --accent: #E74C3C; --sub: #888888; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--panel); padding: 12px; border-bottom: 2px solid var(--accent); z-index: 100; }
        header h1 { font-size: 22px; color: var(--accent); letter-spacing: 3px; font-weight: 900; text-transform: uppercase; text-align: center; }
        .search-engine { width: 100%; background: #000; border: 1px solid var(--sub); border-radius: 20px; padding: 10px 15px; color: white; outline: none; margin-top: 10px; }

        .banner { width: 100%; height: 140px; background: #000; overflow: hidden; position: relative; }
        .banner-track { display: flex; animation: swipe 15s infinite; width: 300%; }
        .banner-track img { width: 33.33%; height: 140px; object-fit: cover; opacity: 0.6; }
        @keyframes swipe { 0%, 30% { transform: translateX(0); } 33%, 63% { transform: translateX(-33.33%); } 66%, 100% { transform: translateX(-66.66%); } }

        .ad-banner { background: #111; padding: 10px; text-align: center; font-size: 10px; color: var(--sub); border-bottom: 1px solid #333; text-transform: uppercase; letter-spacing: 2px; }

        .main-feed { flex: 1; overflow-y: auto; padding: 15px; }
        .section-title { color: var(--accent); font-size: 14px; font-weight: bold; margin: 20px 0 10px; text-transform: uppercase; border-left: 3px solid var(--accent); padding-left: 10px; }
        
        .card-link { text-decoration: none; color: inherit; display: block; margin-bottom: 20px; transition: transform 0.2s; }
        .card { background: var(--panel); border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-info { padding: 15px; }
        .tag { color: var(--accent); font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .title { font-size: 18px; font-weight: bold; margin: 5px 0; }
        .details { font-size: 12px; color: var(--sub); line-height: 1.6; }

        .chat-ui { background: var(--panel); border-top: 2px solid var(--accent); padding: 10px; }
        #logs { height: 60px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; }
        .controls { display: flex; gap: 5px; }
        .nick-box { width: 70px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 12px; padding: 8px; text-align: center; font-weight: bold; }
        .msg-box { flex: 1; background: #222; border: 1px solid #444; color: white; border-radius: 12px; padding: 8px 15px; }
    </style>
</head>
<body>

    <header>
        <h1>OMNIVERSE</h1>
        <input type="text" class="search-engine" placeholder="Search Anime, Manga, Manhwa, Voice Actors...">
    </header>

    <div class="banner">
        <div class="banner-track">
            <img src="https://images.unsplash.com/photo-1541876072-be623c44fc47?w=800" alt="Anime 1">
            <img src="https://images.unsplash.com/photo-1578632738908-4521c726eec6?w=800" alt="Anime 2">
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=800" alt="Anime 3">
        </div>
    </div>

    <div class="ad-banner">Google AdSense Partner • Revenue Active</div>

    <div class="main-feed">
        <div class="section-title">Latest & Upcoming Anime</div>
        <div id="anime-feed"></div>

        <div class="section-title">Top Manga, Manhwa & Manhua</div>
        <div id="manga-feed"></div>
    </div>

    <div class="chat-ui">
        <div id="logs"><b>System:</b> Welcome to Omniverse Global Database.</div>
        <div class="controls">
            <input type="text" id="nick" class="nick-box" value="Boss">
            <input type="text" id="msg" class="msg-box" placeholder="Type a message...">
            <button onclick="chat()" style="background:var(--accent); border:none; color:white; padding:0 15px; border-radius:12px;">SEND</button>
        </div>
    </div>

    <script>
        function chat() {
            const n = document.getElementById('nick').value;
            const m = document.getElementById('msg').value;
            if(m) {
                document.getElementById('logs').innerHTML += `<div><b style="color:#E74C3C">${n}:</b> ${m}</div>`;
                document.getElementById('msg').value = "";
                document.getElementById('logs').scrollTop = document.getElementById('logs').scrollHeight;
            }
        }

        async function fetchData(url, targetId) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                const container = document.getElementById(targetId);
                
                data.data.slice(0, 10).forEach(item => {
                    container.innerHTML += `
                        <a href="${item.url}" target="_blank" class="card-link">
                            <div class="card">
                                <img src="${item.images.jpg.large_image_url}" alt="Cover">
                                <div class="card-info">
                                    <span class="tag">${item.type || 'Media'} • ${item.status}</span>
                                    <h3 class="title">${item.title}</h3>
                                    <div class="details">
                                        ${item.studios ? `<b>Studio:</b> ${item.studios.map(s => s.name).join(', ')}<br>` : ''}
                                        ${item.authors ? `<b>Author:</b> ${item.authors.map(a => a.name).join(', ')}<br>` : ''}
                                        <b>Score:</b> ${item.score || 'N/A'} | <b>Rank:</b> #${item.rank}
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                });
            } catch (e) { console.error("Sync Error"); }
        }

        // Load Anime and Manga/Manhwa/Manhua
        fetchData('https://api.jikan.moe/v4/top/anime', 'anime-feed');
        fetchData('https://api.jikan.moe/v4/top/manga', 'manga-feed');
    </script>
</body>
                </html>
