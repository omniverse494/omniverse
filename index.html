<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Omniverse - Anime, Manga, and Manhwa Database.">
    <meta name="google-site-verification" content="s1LpdFQDsO-k3mGLHAsP62N2V955khk8kZsyeon9G1M" />
    <title>OMNIVERSE</title>
    
    <style>
        :root { --bg: #0d0d0d; --panel: #161616; --accent: #FF4500; --text: #FFF; --sub: #aaaaaa; --border: #262626; }
        .light-mode { --bg: #F5F5F5; --panel: #FFF; --accent: #E74C3C; --text: #111; --sub: #666; --border: #DDD; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* 🔱 CLEAN HEADER & SEARCH BAR */
        header { padding: 15px 25px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        header h1 { font-size: 22px; color: var(--text); letter-spacing: 2px; font-weight: 800; }
        header h1 span { color: var(--accent); }
        
        .search-area { flex: 1; display: flex; max-width: 500px; }
        .search-area input { width: 100%; padding: 10px 15px; background: #000; border: 1px solid var(--border); color: white; border-radius: 4px 0 0 4px; outline: none; font-size: 14px; }
        .search-area button { background: var(--accent); border: none; padding: 0 20px; color: white; font-weight: 600; border-radius: 0 4px 4px 0; cursor: pointer; }
        
        /* WHITE / BLACK TOGGLE */
        .theme-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 15px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; text-transform: uppercase; }
        .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* CLEAN AUTO-SWIPE BANNER */
        .banner { width: 100%; height: 320px; overflow: hidden; position: relative; border-bottom: 1px solid var(--border); background: #000; }
        .banner-track { display: flex; width: 400%; height: 100%; animation: slide 16s infinite; }
        .banner-track .slide { width: 25%; height: 100%; }
        .banner-track img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); }
        
        @keyframes slide { 
            0%, 20% { transform: translateX(0); } 
            25%, 45% { transform: translateX(-25%); } 
            50%, 70% { transform: translateX(-50%); } 
            75%, 95% { transform: translateX(-75%); } 
        }
        
        .banner-text { position: absolute; bottom: 30px; left: 25px; z-index: 10; pointer-events: none; }
        .banner-text h2 { font-size: 28px; font-weight: 800; letter-spacing: 1px; }

        /* LAYOUT DESIGN */
        .main-grid { display: flex; flex-wrap: wrap; padding: 25px; gap: 25px; max-width: 1600px; margin: 0 auto; }
        .content { flex: 2.5; min-width: 350px; }
        .side { flex: 1; min-width: 300px; position: sticky; top: 90px; height: calc(100vh - 120px); }

        .label { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; margin: 20px 0 12px; letter-spacing: 1px; display: block; }

        /* DATA CARDS */
        .card { display: flex; gap: 20px; background: var(--panel); padding: 20px; border-radius: 6px; margin-bottom: 15px; border: 1px solid var(--border); text-decoration: none; color: inherit; }
        .card:hover { border-color: var(--accent); }
        .card img { width: 105px; height: 150px; object-fit: cover; border-radius: 4px; }
        .details { flex: 1; }
        .details h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
        .meta { font-size: 12px; color: var(--sub); line-height: 1.6; margin-bottom: 10px; }
        .meta b { color: var(--text); }
        .links { display: flex; gap: 8px; margin-top: 5px; }
        .btn-portal { font-size: 11px; padding: 6px 12px; border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-weight: 500; text-decoration: none; }
        .btn-portal:hover { border-color: var(--accent); color: var(--accent); }

        /* CLEAN CHAT SYSTEM */
        .nexus { background: var(--panel); border: 1px solid var(--border); height: 100%; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden; }
        #logs { flex: 1; padding: 15px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
        .ui { padding: 12px; background: rgba(0,0,0,0.1); border-top: 1px solid var(--border); }
        .nick-in { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); color: var(--accent); border-radius: 4px; font-weight: 600; margin-bottom: 8px; outline: none; font-size: 12px; }
        .msg-row { display: flex; gap: 8px; }
        .msg-row input { flex: 1; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 4px; outline: none; font-size: 13px; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 0 15px; border-radius: 4px; font-weight: 600; cursor: pointer; }

        .ads-slot { background: rgba(255,255,255,0.01); border: 1px dashed var(--border); padding: 15px; text-align: center; color: #555; font-size: 11px; margin-bottom: 15px; border-radius: 4px; }

        @media (max-width: 900px) { .side { position: static; height: 400px; } .banner { height: 220px; } }
    </style>
</head>
<body>

<header>
    <h1>OMNI<span>VERSE</span></h1>
    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Search Anime or Manga...">
        <button onclick="search()">Search</button>
    </div>
    <button class="theme-btn" onclick="document.body.classList.toggle('light-mode')">Theme</button>
</header>

<div class="banner">
    <div class="banner-track">
        <div class="slide"><img src="https://cdn.myanimelist.net/images/anime/1107/138909l.jpg" style="object-position: top;"></div>
        <div class="slide"><img src="https://cdn.myanimelist.net/images/anime/1792/138022l.jpg" style="object-position: top;"></div>
        <div class="slide"><img src="https://cdn.myanimelist.net/images/anime/1015/138075l.jpg" style="object-position: top;"></div>
        <div class="slide"><img src="https://cdn.myanimelist.net/images/anime/1693/138042l.jpg" style="object-position: top;"></div>
    </div>
    <div class="banner-text">
        <h2>Dashboard Feed</h2>
    </div>
</div>

<div class="main-grid">
    <div class="content">
        <div class="ads-slot">Sponsored Advertisement Slot</div>
        
        <span class="label">Upcoming Releases</span>
        <div id="upcoming-feed"></div>
        
        <span class="label">Top Manga & Manhwa</span>
        <div id="manga-feed"></div>
    </div>

    <div class="side">
        <span class="label">Community Chat</span>
        <div class="nexus">
            <div id="logs"><div style="color:var(--sub)">[System]: Connected to database. Please set a nickname.</div></div>
            <div class="ui">
                <input type="text" id="nick" class="nick-in" placeholder="Set Nickname..." value="User">
                <div class="msg-row">
                    <input type="text" id="msg" placeholder="Type a message...">
                    <button class="send-btn" onclick="send()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function send() {
        const n = document.getElementById('nick').value || "Guest";
        const m = document.getElementById('msg').value;
        const l = document.getElementById('logs');
        if(m) {
            l.innerHTML += `<div><b style="color:var(--accent)">${n}:</b> ${m}</div>`;
            document.getElementById('msg').value = "";
            l.scrollTop = l.scrollHeight;
        }
    }

    async function fetchData(q = '') {
        try {
            const api = q ? `https://api.jikan.moe/v4/anime?q=${q}` : 'https://api.jikan.moe/v4/seasons/upcoming';
            const res = await fetch(api);
            const data = await res.json();
            const uFeed = document.getElementById('upcoming-feed');
            uFeed.innerHTML = '';

            data.data.slice(0, 10).forEach(item => {
                uFeed.innerHTML += `
                    <div class="card">
                        <img src="${item.images.jpg.large_image_url}">
                        <div class="details">
                            <h3>${item.title}</h3>
                            <div class="meta">
                                <b>Studio:</b> ${item.studios[0]?.name || 'TBA'}<br>
                                <b>Source:</b> ${item.source} | <b>Score:</b> ${item.score || 'N/A'}<br>
                                <b>Info:</b> Production staff and details available via portal
                            </div>
                            <div class="links">
                                <a href="${item.url}" target="_blank" class="btn-portal">Official Info</a>
                                <a href="${item.trailer.url || item.url}" target="_blank" class="btn-portal">Watch Trailer</a>
                            </div>
                        </div>
                    </div>`;
            });

            if(!q) {
                const mRes = await fetch('https://api.jikan.moe/v4/top/manga');
                const mData = await mRes.json();
                const mFeed = document.getElementById('manga-feed');
                mFeed.innerHTML = '';
                mData.data.slice(0, 10).forEach(item => {
                    mFeed.innerHTML += `
                        <div class="card">
                            <img src="${item.images.jpg.large_image_url}">
                            <div class="details">
                                <h3>${item.title}</h3>
                                <div class="meta">
                                    <b>Author:</b> ${item.authors[0]?.name || 'N/A'}<br>
                                    <b>Type:</b> ${item.type} | <b>Rank:</b> #${item.rank}<br>
                                    <b>Score:</b> ⭐ ${item.score}
                                </div>
                                <div class="links">
                                    <a href="${item.url}" target="_blank" class="btn-portal">Read Info</a>
                                </div>
                            </div>
                        </div>`;
                });
            }
        } catch (e) { console.log("Error syncing data."); }
    }

    function search() {
        const q = document.getElementById('searchInput').value;
        if(q) fetchData(q);
    }

    fetchData();
</script>
</body>
            </html>
