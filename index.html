<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNIVERSE: Ultimate Anime & Manga Database Core</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0a0a12; --panel-bg: rgba(16, 16, 28, 0.85); --accent: #FF3B30;
            --text: #E2E8F0; --text-dim: #A0AEC0; --border: rgba(255, 59, 48, 0.2);
            --ai-accent: #9D4EDD; --ai-glow: rgba(157, 78, 221, 0.5);
            --font-cyber: 'Orbitron', sans-serif; --font-data: 'Rajdhani', sans-serif;
        }
        .light-mode {
            --bg: #F7FAFC; --panel-bg: rgba(255, 255, 255, 0.95); --accent: #D32F2F;
            --text: #1A202C; --text-dim: #4A5568; --border: rgba(211, 47, 47, 0.3);
            --ai-accent: #6B21A8; --ai-glow: rgba(107, 33, 168, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg); color: var(--text); font-family: var(--font-data);
            overflow: hidden; height: 100vh; width: 100vw; position: relative;
            transition: background 0.3s ease;
        }
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        header {
            background: rgba(0,0,0,0.85); padding: 12px 16px; display: flex; align-items: center; 
            justify-content: space-between; border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 10;
        }
        .app-identity h1 {
            font-family: var(--font-cyber); font-size: 20px; font-weight: 700;
            color: var(--accent); letter-spacing: 2px;
        }
        .search-container { position: relative; width: 50%; max-width: 350px; }
        .search-container input {
            width: 100%; padding: 8px 36px 8px 14px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); border-radius: 4px; color: var(--text);
            font-family: var(--font-data); font-size: 14px; outline: none;
        }
        .search-container input:focus { border-color: var(--accent); }
        .search-container svg {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; fill: var(--text-dim); cursor: pointer;
        }
        .header-actions { display: flex; gap: 8px; }
        .btn-circle {
            padding: 6px 12px; background: var(--panel-bg); border: 1px solid var(--border); 
            color: var(--text); font-family: var(--font-cyber); font-size: 11px; cursor: pointer; font-weight: bold;
        }
        .main-viewport { flex: 1; position: relative; overflow: hidden; }
        .app-panel-view {
            position: absolute; top:0; left:0; width:100%; height:100%;
            display: none; flex-direction: column; padding: 16px; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .app-panel-view.active-panel { display: flex; }
        
        /* Auto Slider Frame */
        .hero-banner-slider { width: 100%; height: 160px; border-radius: 4px; overflow: hidden; margin-bottom: 20px; border: 1px solid var(--border); position: relative; }
        .banner-track { display: flex; width: 400%; height: 100%; transition: transform 0.5s ease-in-out; }
        .slide { width: 25%; height: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
        .slide-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 12px 10px 12px; background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); color: #fff; font-family: var(--font-cyber); font-size: 13px; font-weight: bold; }

        .section-headline { font-family: var(--font-cyber); font-size: 14px; color: var(--accent); margin-bottom: 14px; letter-spacing: 1px; border-left: 3px solid var(--accent); padding-left: 8px; }
        .data-grid-feed { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
        @media(min-width: 600px) { .data-grid-feed { grid-template-columns: repeat(2, 1fr); } }
        
        /* Advanced Information Layout */
        .card { background: var(--panel-bg); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
        .card-main-content { display: flex; gap: 12px; padding: 12px; }
        .card-poster-wrapper { width: 100px; height: 145px; flex-shrink: 0; position: relative; border: 1px solid var(--border); }
        .card-poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .card-info-pane { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .card-info-pane h3 { font-size: 15px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .meta-line { font-size: 12px; color: var(--text-dim); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; }
        .meta-line b { color: var(--text); font-weight: 600; }
        
        .extended-details-box { background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
        .crew-chips, .va-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .data-chip { background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 3px; font-size: 11px; color: var(--text); border: 1px solid rgba(255,255,255,0.05); }
        
        .card-action-footer { display: flex; border-top: 1px solid var(--border); background: rgba(0,0,0,0.4); }
        .btn-card-foot { flex: 1; padding: 8px; background: transparent; border: none; color: var(--text); font-family: var(--font-cyber); font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; border-right: 1px solid var(--border); }
        .btn-card-foot:last-child { border-right: none; }
        .btn-card-foot:hover { background: var(--accent); color: #000; }
        /* Audio Hub View Design */
        .audio-matrix-hub { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .deck-disc-container { width: 180px; height: 180px; border-radius: 50%; border: 4px dashed var(--accent); display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 24px; }
        .deck-disc-inner { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #2C0806 30%, #020205 100%); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .deck-disc-inner.playing { animation: spinDisc 6s linear infinite; }
        @keyframes spinDisc { 100% { transform: rotate(360deg); } }
        .deck-center-node { width: 34px; height: 34px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
        .track-metadata-plate { text-align: center; margin-bottom: 24px; }
        #musicTitle { font-family: var(--font-cyber); font-size: 15px; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
        .audio-stream-status-log { font-size: 11px; color: var(--text-dim); font-weight: bold; letter-spacing: 1px; }
        .audio-control-cluster { display: flex; align-items: center; gap: 24px; }
        .btn-audio-core { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,59,48,0.1); border: 2px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-audio-next { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-audio-core svg { width: 24px; height: 24px; fill: currentColor; }
        .btn-audio-next svg { width: 20px; height: 20px; fill: currentColor; }

        /* Community Chat Sub-system Layout */
        .chat-ai-integration-node { background: rgba(157,78,221,0.06); border: 1px dashed var(--ai-accent); padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .ai-status-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: bold; }
        #aiStatusText { color: var(--text-dim); max-width: 70%; line-height: 1.3; }
        .btn-ai-toggle { padding: 4px 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--ai-accent); color: var(--ai-accent); font-family: var(--font-cyber); font-size: 10px; cursor: pointer; font-weight: bold; }
        .btn-ai-toggle.ai-online { background: var(--ai-accent); color: #fff; box-shadow: 0 0 10px var(--ai-glow); }
        .chat-log-timeline { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        .chat-row { display: flex; gap: 10px; align-items: flex-start; }
        .chat-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover; background: #111; }
        .chat-body { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .chat-header-info { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .chat-badge { font-size: 8px; font-weight: bold; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; background: rgba(255,255,255,0.1); color: #fff; }
        .chat-badge.badge-root { background: #FF3B30; } .chat-badge.badge-core { background: var(--ai-accent); } .chat-badge.badge-member { background: #34C759; }
        .chat-message-bubble { background: rgba(255,255,255,0.05); border-radius: 4px; padding: 8px 12px; font-size: 13px; line-height: 1.4; word-break: break-word; color: #E2E8F0; border: 1px solid rgba(255,255,255,0.02); }
        .chat-input-gate { display: flex; gap: 8px; }
        .chat-input-gate input { flex: 1; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); font-family: var(--font-data); font-size: 14px; outline: none; }
        .btn-chat-send { padding: 0 20px; background: var(--accent); border: none; color: #fff; font-family: var(--font-cyber); font-size: 12px; font-weight: bold; cursor: pointer; }

        .profile-setup-card { background: var(--panel-bg); border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .profile-avatar-uploader { display: flex; align-items: center; gap: 16px; background: rgba(0,0,0,0.3); padding: 12px; border: 1px dashed var(--border); }
        .profile-avatar-uploader img { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .file-upload-trigger { position: relative; overflow: hidden; background: rgba(255,59,48,0.1); border: 1px solid var(--accent); color: var(--accent); font-size: 11px; font-weight: bold; padding: 6px 12px; cursor: pointer; font-family: var(--font-cyber); }
        .file-upload-trigger input { position: absolute; right: 0; top: 0; opacity: 0; cursor: pointer; }
        .input-group-field { display: flex; flex-direction: column; gap: 6px; }
        .input-group-field label { font-size: 11px; color: var(--accent); font-family: var(--font-cyber); letter-spacing: 0.5px; }
        .input-group-field input, .input-group-field select { padding: 8px 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text); font-family: var(--font-data); font-size: 14px; outline: none; }
        
        .modal-portal-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.95); z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(5px); }
        .modal-viewport-box { width: 100%; max-width: 600px; background: #000; border: 1px solid var(--border); position: relative; }
        .video-aspect-frame { position: relative; width: 100%; padding-top: 56.25%; }
        .video-aspect-frame iframe { position: absolute; top:0; left:0; width:100%; height:100%; border: none; }
        .btn-modal-close { position: absolute; top: -40px; right: 0; background: transparent; border: none; color: #fff; font-size: 30px; cursor: pointer; }

        footer { background: rgba(0,0,0,0.95); border-top: 1px solid var(--border); padding: 8px; z-index: 10; }
        .nav-tabs-container { display: flex; justify-content: space-between; }
        .nav-tab-item { background: transparent; border: none; color: var(--text-dim); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; padding: 6px 0; }
        .nav-tab-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-tab-item span { font-size: 11px; font-family: var(--font-cyber); font-weight: 500; }
        .nav-tab-item.active-tab { color: var(--accent); }
    </style>
</head>
<body>
<div class="app-container">
    <header>
        <div class="app-identity"><h1>OMNIVERSE</h1></div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Anime, Manga, Manhwa..." onkeydown="if(event.key === 'Enter') window.search()">
            <svg onclick="window.search()" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <div class="header-actions"><button class="btn-circle" onclick="window.toggleInterfaceMode()">THEME</button></div>
    </header>
    <main class="main-viewport">
        <div class="app-panel-view active-panel" id="panel-explore">
            <div class="hero-banner-slider"><div class="banner-track" id="banner-track"></div></div>
            <div class="section-headline">✨ CURRENT SEASON & UPCOMING BROADCAST PIPELINE</div>
            <div class="data-grid-feed" id="upcoming-feed"></div>
            <div class="section-headline">📖 ARCHIVED ARCHITECTURE (MANGA, MANHWA, MANHUA)</div>
            <div class="data-grid-feed" id="manga-feed"></div>
        </div>
        <div class="app-panel-view" id="panel-audio">
            <div class="audio-matrix-hub">
                <div class="deck-disc-container"><div class="deck-disc-inner" id="musicDisc"><div class="deck-center-node"></div></div></div>
                <div class="track-metadata-plate"><h2 id="musicTitle">Anime Hits Terminal</h2><div class="audio-stream-status-log">ZENOFM ENCRYPTED LIVE FEED LINK ACTIVE</div></div>
                <div class="audio-control-cluster">
                    <button class="btn-audio-core" onclick="window.toggleMusic()" id="playIconSvg"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                    <button class="btn-audio-next" onclick="window.nextMusic()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                </div>
            </div>
        </div>
        <div class="app-panel-view" id="panel-chat">
            <div class="chat-ai-integration-node">
                <div class="ai-status-row">
                    <span id="aiStatusText">AI CORE DISCONNECTED (LOCAL LOGS ARCHIVE ACTIVE)</span>
                    <button class="btn-ai-toggle" id="aiToggleBtn" onclick="window.toggleAiCore()">CONNECT AI CORE</button>
                </div>
            </div>
            <div class="chat-log-timeline" id="logs"></div>
            <div class="chat-input-gate">
                <input type="text" id="msg" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') window.sendMsg()">
                <button class="btn-chat-send" onclick="window.sendMsg()">SEND</button>
            </div>
        </div>
        <div class="app-panel-view" id="panel-profile">
            <div class="profile-setup-card">
                <div class="profile-avatar-uploader">
                    <img id="avatarPreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" alt="node">
                    <div class="file-upload-trigger">CHOOSE AVATAR<input type="file" id="fileInput" accept="image/*"></div>
                </div>
                <div class="input-group-field"><label>NICKNAME ALIAS</label><input type="text" id="nick" placeholder="Enter name..."></div>
                <div class="input-group-field"><label>ACCESS LEVEL</label><select id="userBadge"><option value="member">MEMBER</option><option value="root">ROOT ADMIN</option></select></div>
                <button class="btn-card-foot" onclick="window.saveProfileSettings(); alert('Profile Synchronized.');" style="background:var(--accent); color:#000; border-radius:4px;">SAVE CONFIG</button>
            </div>
        </div>
    </main>
    <footer>
        <div class="nav-tabs-container">
            <button class="nav-tab-item active-tab" id="tab-btn-explore" onclick="window.switchAppView('explore')"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg><span>Explore</span></button>
            <button class="nav-tab-item" id="tab-btn-audio" onclick="window.switchAppView('audio')"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg><span>Audio</span></button>
            <button class="nav-tab-item" id="tab-btn-chat" onclick="window.switchAppView('chat')"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg><span>Chat</span></button>
            <button class="nav-tab-item" id="tab-btn-profile" onclick="window.switchAppView('profile')"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s1.79-4 4-4-1.79 4-4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></button>
        </div>
    </footer>
</div>
<div class="modal-portal-overlay" id="videoModal"><div class="modal-viewport-box"><button class="btn-modal-close" onclick="window.closeVideo()">×</button><div class="video-aspect-frame"><iframe id="videoIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe></div></div></div>
<audio id="mainAudio" preload="none"></audio>
<script>
    const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";
    const aiAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239D4EDD'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>";
    let userAvatarBase64 = defaultAvatar;
    let chatDb;
    let aiCoreActive = false;
    let currentSlide = 0;
    let slideInterval;

    if (localStorage.getItem('omniverse_theme') === 'light') { document.body.classList.add('light-mode'); }
    window.toggleInterfaceMode = function() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('omniverse_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    };

    function sanitize(str) { return str ? str.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

    window.toggleAiCore = function() {
        const btn = document.getElementById('aiToggleBtn');
        const txt = document.getElementById('aiStatusText');
        aiCoreActive = !aiCoreActive;
        if (aiCoreActive) {
            btn.classList.add('ai-online'); btn.innerText = "DISCONNECT CORE";
            txt.innerText = "GEMINI 3 FLASH CORE RUNNING: LIVE INTEL RESPONSE MATRICES ACTIVE";
        } else {
            btn.classList.remove('ai-online'); btn.innerText = "CONNECT AI CORE";
            txt.innerText = "AI CORE DISCONNECTED (LOCAL LOGS ARCHIVE ACTIVE)";
        }
    };

    window.switchAppView = function(viewId) {
        document.querySelectorAll('.app-panel-view').forEach(p => p.classList.remove('active-panel'));
        document.querySelectorAll('.nav-tab-item').forEach(t => t.classList.remove('active-tab'));
        document.getElementById(`panel-${viewId}`).classList.add('active-panel');
        document.getElementById(`tab-btn-${viewId}`).classList.add('active-tab');
    };

    // Auto Swipe Engine
    function startBannerSlider() {
        clearInterval(slideInterval);
        const track = document.getElementById('banner-track');
        slideInterval = setInterval(() => {
            if (track && track.children.length > 0) {
                currentSlide = (currentSlide + 1) % track.children.length;
                track.style.transform = `translateX(-${currentSlide * 25}%)`;
            }
        }, 4000); // Swipes every 4 seconds automatically
    }

    // Jikan API Deep Fetcher Engine
    async function fetchDeepAnimeMetadata(animeId) {
        try {
            await new Promise(resolve => setTimeout(resolve, 500)); // Rate-limiting guard
            const staffRes = await fetch(`https://api.jikan.moe/v4/anime/${animeId}/staff`);
            const staffData = await staffRes.json();
            let director = "N/A", animator = "N/A";
            
            if(staffData.data) {
                const dirObj = staffData.data.find(s => s.positions.some(p => p.toLowerCase().includes('director')));
                if(dirObj) director = dirObj.person.name;
                const animObj = staffData.data.find(s => s.positions.some(p => p.toLowerCase().includes('animation') || p.toLowerCase().includes('key')));
                if(animObj) animator = animObj.person.name;
            }

            const charRes = await fetch(`https://api.jikan.moe/v4/anime/${animeId}/characters`);
            const charData = await charRes.json();
            let vaList = [];
            if(charData.data && charData.data.length > 0) {
                let count = 0;
                for(let c of charData.data) {
                    const jaVa = c.voice_actors.find(va => va.language === 'Japanese');
                    if(jaVa) { vaList.push(jaVa.person.name); count++; }
                    if(count >= 3) break;
                }
            }
            return { director, animator, voiceActors: vaList.join(', ') || "N/A" };
        } catch(e) { 
            return { director: "Production Team", animator: "Studio Staff", voiceActors: "TBA" }; 
        }
    }

    async function fetchData(query = '') {
        try {
            const topRes = await fetch('https://api.jikan.moe/v4/top/anime?limit=4'), topData = await topRes.json();
            const track = document.getElementById('banner-track');
            if(track && topData.data) {
                track.innerHTML = '';
                topData.data.forEach(a => {
                    track.innerHTML += `<div class="slide"><img src="${a.images.jpg.large_image_url}"><div class="slide-overlay">${sanitize(a.title)}</div></div>`;
                });
                startBannerSlider();
            }
        } catch(e){}

        try {
            const uFeed = document.getElementById('upcoming-feed');
            uFeed.innerHTML = '<div style="padding:20px; color:var(--accent);">Compiling Matrix Nodes...</div>';
            const url = query ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}` : 'https://api.jikan.moe/v4/seasons/upcoming';
            const res = await fetch(url), data = await res.json();
            uFeed.innerHTML = '';
            
            if(data.data) {
                const items = data.data.slice(0, 6);
                for(let item of items) {
                    const studio = item.studios?.[0]?.name || 'TBA';
                    const licensors = item.licensors?.map(l => l.name).join(', ') || 'Official Broadcast Channels / TBA';
                    const trailerUrl = item.trailer?.url || '';
                    const malUrl = item.url || '#';
                    
                    let cardId = `extra-${item.mal_id}`;
                    uFeed.innerHTML += `
                        <div class="card">
                            <div class="card-main-content">
                                <div class="card-poster-wrapper"><img src="${item.images.jpg.image_url}"></div>
                                <div class="card-info-pane">
                                    <h3>${sanitize(item.title)}</h3>
                                    <div class="meta-line"><b>Studio:</b> ${sanitize(studio)}</div>
                                    <div class="meta-line"><b>Licensing:</b> ${sanitize(licensors)}</div>
                                    <div class="meta-line"><b>Source:</b> ${sanitize(item.source || 'Original')}</div>
                                    <div class="meta-line"><b>Status:</b> ${sanitize(item.status)}</div>
                                </div>
                            </div>
                            <div class="extended-details-box" id="${cardId}">
                                <div class="meta-line"><b>Director:</b> Loading Core...</div>
                                <div class="meta-line"><b>Key Animators:</b> Loading Core...</div>
                                <div class="meta-line"><b>Main VAs:</b> Loading...</div>
                            </div>
                            <div class="card-action-footer">
                                <button class="btn-card-foot" onclick="window.playVideo('${trailerUrl}')">🎬 TRAILER</button>
                                <a class="btn-card-foot" href="${malUrl}" target="_blank">🔗 OFFICIAL INFO</a>
                            </div>
                        </div>`;
                    
                    fetchDeepAnimeMetadata(item.mal_id).then(extra => {
                        const box = document.getElementById(cardId);
                        if(box) {
                            box.innerHTML = `
                                <div class="meta-line"><b>Director:</b> ${sanitize(extra.director)}</div>
                                <div class="meta-line"><b>Key Animator:</b> ${sanitize(extra.animator)}</div>
                                <div class="meta-line"><b>Main VAs:</b> <span style="color:var(--accent);">${sanitize(extra.voiceActors)}</span></div>`;
                        }
                    });
                }
            }
        } catch(e){}

        if(!query) {
            try {
                const mFeed = document.getElementById('manga-feed');
                const res = await fetch('https://api.jikan.moe/v4/top/manga?limit=6'), data = await res.json();
                mFeed.innerHTML = '';
                data.data.forEach(item => {
                    const author = item.authors?.[0]?.name || 'Unknown Author';
                    const type = item.type || 'Manga'; // Detects Manga, Manhwa, Manhua automatically
                    mFeed.innerHTML += `
                        <div class="card">
                            <div class="card-main-content">
                                <div class="card-poster-wrapper"><img src="${item.images.jpg.image_url}"></div>
                                <div class="card-info-pane">
                                    <h3>[${sanitize(type)}] ${sanitize(item.title)}</h3>
                                    <div class="meta-line"><b>Author/Creator:</b> ${sanitize(author)}</div>
                                    <div class="meta-line"><b>Chapters:</b> ${item.chapters || 'Publishing'}</div>
                                    <div class="meta-line"><b>Global Score:</b> ⭐ ${item.score || 'N/A'}</div>
                                </div>
                            </div>
                            <div class="card-action-footer">
                                <a class="btn-card-foot" href="${item.url}" target="_blank">📖 ARCHIVE ARCHITECTURE</a>
                            </div>
                        </div>`;
                });
            } catch(e){}
        }
    }

    window.playVideo = function(url) {
        if(!url) { alert("No Official Trailer Stream deployed for this entity."); return; }
        let embed = url;
        if(url.includes("v=")) embed = `https://www.youtube.com/embed/${url.split("v=")[1].split("&")[0]}?autoplay=1`;
        else if(url.includes("youtu.be/")) embed = `https://www.youtube.com/embed/${url.split("youtu.be/")[1].split("?")[0]}?autoplay=1`;
        document.getElementById('videoIframe').src = embed;
        document.getElementById('videoModal').style.display = 'flex';
    };
    window.closeVideo = function() { document.getElementById('videoModal').style.display = 'none'; document.getElementById('videoIframe').src = ''; };

    // Audio Player Protocol
    const tracks = [
        { title: "Anime Hits & Openings Terminal", url: "https://stream.zeno.fm/03w7v6w37fevv" },
        { title: "Chill Anime Lofi Matrix Beats", url: "https://stream.zeno.fm/0v8g78p37fevv" },
        { title: "J-Pop Global Synchronized Feed", url: "https://stream.zeno.fm/3r08w9p37fevv" }
    ];
    let currentTrackIdx = 0;

    window.toggleMusic = function() {
        const aud = document.getElementById('mainAudio'), disc = document.getElementById('musicDisc'), icon = document.getElementById('playIconSvg');
        if (!aud.src || aud.src.includes(window.location.hostname)) { aud.src = tracks[currentTrackIdx].url; aud.load(); }
        if (aud.paused) {
            aud.play().then(() => {
                disc.classList.add('playing');
                icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            }).catch(() => { alert("Handshake Protocol Alert: Tap screen first before initiating raw audio streams."); });
        } else {
            aud.pause(); disc.classList.remove('playing');
            icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        }
    };

    window.nextMusic = function() {
        currentTrackIdx = (currentTrackIdx + 1) % tracks.length;
        document.getElementById('musicTitle').innerText = tracks[currentTrackIdx].title;
        const aud = document.getElementById('mainAudio'); aud.src = tracks[currentTrackIdx].url; aud.load();
        aud.play().then(() => { document.getElementById('musicDisc').classList.add('playing'); }).catch(() => {});
    };

    function simulateAiCoreResponse(userMessage) {
        setTimeout(() => {
            let reply = "Packet intercepted. OMNIVERSE AI Core cluster query engine is active.";
            if(userMessage.toLowerCase().includes("hello") || userMessage.toLowerCase().includes("hi")) reply = "Hello node! Connection clean. I am fully integrated into the OMNIVERSE Core Database module.";
            chatDb.push({ nickname: "OMNIVERSE_AI_CORE", badge: "core", avatar: aiAvatar, message: reply, timestamp: firebase.database.ServerValue.TIMESTAMP });
        }, 1000);
    }

    function startChat() {
        try {
            const config = { databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app/" };
            firebase.initializeApp(config); chatDb = firebase.database().ref("chat_messages");

            window.sendMsg = function() {
                const m = document.getElementById('msg').value;
                if(m.trim()) {
                    chatDb.push({ nickname: localStorage.getItem('omniverse_nick') || "Guest Node", badge: localStorage.getItem('omniverse_badge') || "member", avatar: userAvatarBase64, message: sanitize(m), timestamp: firebase.database.ServerValue.TIMESTAMP });
                    document.getElementById('msg').value = ""; if(aiCoreActive) simulateAiCoreResponse(m);
                }
            };

            chatDb.limitToLast(35).on("value", function(snap) {
                const logs = document.getElementById('logs'); logs.innerHTML = '';
                snap.forEach(function(child) {
                    const d = child.val();
                    logs.innerHTML += `<div class="chat-row"><img class="chat-avatar" src="${d.avatar || defaultAvatar}"><div class="chat-body"><div class="chat-header-info"><span class="chat-badge badge-${d.badge}">${d.badge}</span><b>${d.nickname}</b></div><div class="chat-message-bubble">${d.message}</div></div></div>`;
                });
                logs.scrollTop = logs.scrollHeight;
            });
        } catch(e){}
    }

    window.search = function() { const q = document.getElementById('searchInput').value; if(q.trim()) { window.switchAppView('explore'); fetchData(q); } };
    window.onload = function() { startChat(); fetchData(); };
</script>
