<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE CLOUD | Absolute Hub</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #08090c;
            --panel-bg: #12141c;
            --accent: #ff4757;
            --text-main: #ffffff;
            --text-muted: #a4b0be;
            --success: #2ed573;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); padding-bottom: 140px; }
        
        /* Header at Navigation */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--panel-bg); border-bottom: 1px solid #222; }
        .header .logo { font-weight: 800; color: var(--accent); letter-spacing: 1px; }
        .view-section { display: none; padding: 15px; max-width: 1200px; margin: 0 auto; }
        .view-section.active { display: block; }

        /* Search Input */
        .search-box { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; }

        /* Grid Cards para sa Anime/Manga */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .api-card { background: var(--panel-bg); border-radius: 8px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; text-decoration: none; color: white; transition: 0.2s; }
        .api-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .api-card img { width: 100%; aspect-ratio: 11/16; object-fit: cover; }
        .api-card-details { padding: 8px; font-size: 0.75rem; flex-grow: 1; }

        /* Live Chat Layout */
        .chat-layout { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .chat-layout { grid-template-columns: 220px 1fr; } }
        .user-list { background: var(--panel-bg); padding: 12px; border-radius: 8px; border: 1px solid #222; max-height: 400px; overflow-y: auto; }
        .online-user { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin-bottom: 8px; cursor: pointer; padding: 6px; border-radius: 4px; background: rgba(255,255,255,0.02); }
        .online-user:hover { background: rgba(255,71,87,0.1); }
        .status-dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; }
        .chat-main { background: var(--panel-bg); border-radius: 8px; border: 1px solid #222; display: flex; flex-direction: column; }
        .chat-messages { height: 300px; overflow-y: auto; padding: 15px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.1); }
        
        .msg-bubble { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; max-width: 80%; width: fit-content; display: flex; align-items: flex-start; gap: 8px; }
        .msg-bubble img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .chat-controls { display: flex; padding: 10px; gap: 8px; background: rgba(0,0,0,0.2); }
        .chat-controls input { flex: 1; padding: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 6px; }
        .chat-controls button { padding: 0 20px; background: var(--accent); border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Audio Row at System Controls */
        .audio-row { display: flex; align-items: center; justify-content: space-between; background: var(--panel-bg); padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #222; }
        .master-player { position: fixed; bottom: 65px; left: 0; right: 0; background: #0b0c10; border-top: 2px solid var(--accent); padding: 12px 20px; z-index: 99; text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .player-btns { display: flex; justify-content: center; gap: 15px; margin-top: 8px; }
        .p-btn { background: var(--accent); border: none; color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* Profile Style */
        .profile-card { background: var(--panel-bg); border-radius: 10px; padding: 25px; text-align: center; max-width: 400px; margin: 0 auto; border: 1px solid #222; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 15px; object-fit: cover; border: 2px solid var(--accent); background: #2c3540; display: block; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel-bg); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222; z-index: 100; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-btn.active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">● OMNIVERSE SYSTEM</div>
        <div id="user-tag" style="font-size: 0.8rem; color: var(--success);">● Syncing Profile...</div>
    </div>

    <div id="home-view" class="view-section active">
        <input type="text" id="anime-search" class="search-box" placeholder="🔍 Mag-search ng Anime, Manga, Manhwa, Manhua..." oninput="filterMediaList()">
        
        <h3 style="margin-bottom: 12px; color: var(--accent); font-size: 0.9rem; letter-spacing: 1px;">AUTO-UPDATED TRENDING ANIME</h3>
        <div id="anime-api-list" class="grid"></div>
        
        <h3 style="margin-top: 25px; margin-bottom: 12px; color: var(--accent); font-size: 0.9rem; letter-spacing: 1px;">AUTO-UPDATED TOP MANGA & MANHWA</h3>
        <div id="manga-api-list" class="grid"></div>
    </div>

    <div id="chat-view" class="view-section">
        <div class="chat-layout">
            <div class="user-list">
                <div onclick="setToGlobalChat()" class="online-user" style="font-weight:bold; color:var(--accent);">🌐 GLOBAL ROOM</div>
                <h4 style="font-size:0.7rem; color:var(--text-muted); margin: 10px 0 5px; text-transform:uppercase;">Private Messages (PM):</h4>
                <div id="active-chatters-list"></div>
            </div>
            <div class="chat-main">
                <div class="chat-messages" id="chat-display-box"></div>
                <div class="chat-controls">
                    <input type="text" id="chat-message-input" placeholder="Sumulat ng live message...">
                    <button onclick="sendLiveMessage()">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <div id="audio-view" class="view-section">
        <input type="text" id="audio-search" class="search-box" placeholder="🔍 Mag-search ng TikTok tracks, Phonk, OPM, o Anime music..." oninput="filterAudioList()">
        <div id="audio-list-container"></div>
    </div>

    <div id="profile-view" class="view-section">
        <div class="profile-card">
            <img id="my-avatar-img" class="profile-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%232c3540'/></svg>">
            <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
            <button onclick="document.getElementById('avatar-file-input').click()" style="background:none; border:none; color:var(--accent); font-size:0.8rem; cursor:pointer; margin-bottom:15px; display:inline-block;">[ Kumuha ng Pic sa Gallery/Files ]</button>
            
            <input type="text" id="username-input" style="width:100%; padding:10px; background:#000; border:1px solid #333; color:white; border-radius:5px; text-align:center; font-weight:bold;" placeholder="Gumawa ng Iyong Identity">
            <button onclick="saveLiveProfile()" style="width:100%; margin-top:10px; padding:10px; background:var(--accent); border:none; color:white; border-radius:5px; font-weight:bold; cursor:pointer;">I-SAVE IDENTITY</button>
        </div>
    </div>

    <div class="master-player">
        <div id="now-playing-title" style="font-size:0.8rem; font-weight:bold; color: var(--text-main);">No track playing</div>
        <div class="player-btns">
            <button class="p-btn" onclick="playPreviousTrack()">⏮ Back</button>
            <button class="p-btn" id="play-pause-toggle-btn" onclick="togglePlayPause()">⏸ Pause</button>
            <button class="p-btn" onclick="playNextTrack()">Next ⏭</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('home', this)"><span>Home</span></button>
        <button class="nav-btn" onclick="switchTab('chat', this)"><span>Chat Room</span></button>
        <button class="nav-btn" onclick="switchTab('audio', this)"><span>Audio Portal</span></button>
        <button class="nav-btn" onclick="switchTab('profile', this)"><span>Profile</span></button>
    </div>

    <audio id="core-audio-engine"></audio>
    <script>
        // 1. INITIALIZE FIREBASE DIRECTLY TO YOUR REALTIME DATABASE URL
        const firebaseConfig = { databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Local System States
        let localUser = localStorage.getItem('omni_name') || "User_" + Math.floor(1000 + Math.random()*9000);
        let localAvatar = localStorage.getItem('omni_pfp') || "";
        let chatTarget = "Global";
        
        let allAnimeMangaCached = [];
        let currentTrackIndex = 0;

        // Sync Profile Data
        function initProfile() {
            document.getElementById('username-input').value = localUser;
            if(localAvatar) document.getElementById('my-avatar-img').src = localAvatar;
            document.getElementById('user-tag').innerText = `● Connected: ${localUser}`;
            
            // I-rehistro sa database upang makita ng ibang online users
            database.ref('users/' + localUser).set({ pfp: localAvatar, lastSeen: Date.now() });
        }

        // Pagkuha ng Larawan mula sa Gallery/Files ng Phone o PC
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    localAvatar = e.target.result; // Ginagawang Base64 text string
                    document.getElementById('my-avatar-img').src = localAvatar;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveLiveProfile() {
            const newName = document.getElementById('username-input').value.trim();
            if(newName) {
                database.ref('users/' + localUser).remove(); // Alisin ang lumang pangalan
                localUser = newName;
                localStorage.setItem('omni_name', localUser);
                localStorage.setItem('omni_pfp', localAvatar);
                initProfile();
                alert("Identity Updated!");
            }
        }

        function switchTab(viewId, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId + '-view').classList.add('active');
            btn.classList.add('active');
        }
        // 2. LIVE REAL-TIME CHAT ENGINE (GLOBAL & PRIVATE CHANNEL)
        function startLiveChatSync() {
            // Makinig sa Global Room
            database.ref('global_messages').limitToLast(30).on('value', snapshot => {
                if(chatTarget === "Global") renderChatBubbles(snapshot.val());
            });

            // Makinig sa lahat ng aktibong users para sa PM channel
            database.ref('users').on('value', snapshot => {
                const users = snapshot.val() || {};
                let html = '';
                for(let username in users) {
                    if(username !== localUser) {
                        html += `
                            <div class="online-user" onclick="setToPMChat('${username}')">
                                <div class="status-dot"></div>
                                <div>${username}</div>
                            </div>
                        `;
                    }
                }
                document.getElementById('active-chatters-list').innerHTML = html;
            });
        }

        function setToGlobalChat() {
            chatTarget = "Global";
            database.ref('global_messages').limitToLast(30).once('value', s => renderChatBubbles(s.val()));
        }

        function setToPMChat(targetUser) {
            chatTarget = targetUser;
            alert(`Naka-pribadong channel ka na ngayon kay: ${targetUser}`);
            // Pagsamahin ang dalawang pangalan para makabuo ng natatanging Room ID sa Firebase
            const roomID = [localUser, targetUser].sort().join("_to_");
            database.ref('pms/' + roomID).limitToLast(30).on('value', snapshot => {
                renderChatBubbles(snapshot.val());
            });
        }

        function renderChatBubbles(data) {
            const box = document.getElementById('chat-display-box');
            box.innerHTML = '';
            if(!data) return;
            for(let id in data) {
                const m = data[id];
                const avatarImg = m.pfp || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23ff4757'/></svg>";
                box.innerHTML += `
                    <div class="msg-bubble">
                        <img src="${avatarImg}">
                        <div>
                            <strong style="color:var(--accent); font-size:0.75rem;">${m.sender}</strong>
                            <p style="margin-top:2px;">${m.text}</p>
                        </div>
                    </div>
                `;
            }
            box.scrollTop = box.scrollHeight;
        }

        function sendLiveMessage() {
            const input = document.getElementById('chat-message-input');
            const txt = input.value.trim();
            if(!txt) return;

            const packet = { sender: localUser, pfp: localAvatar, text: txt, time: Date.now() };

            if(chatTarget === "Global") {
                database.ref('global_messages').push(packet);
            } else {
                const roomID = [localUser, chatTarget].sort().join("_to_");
                database.ref('pms/' + roomID).push(packet);
            }
            input.value = '';
        }
        // 3. AUTO-UPDATED ANIME/MANGA DIRECTORY CORES (LEGAL PLATFORM SEARCH)
        async function loadJikanAPI() {
            try {
                const animeRes = await fetch('https://api.jikan.moe/v4/top/anime?limit=20');
                const animeData = await animeRes.json();
                const mangaRes = await fetch('https://api.jikan.moe/v4/top/manga?limit=20');
                const mangaData = await mangaRes.json();

                allAnimeMangaCached = [
                    ...animeData.data.map(i => ({...i, omniType: 'anime'})),
                    ...mangaData.data.map(i => ({...i, omniType: 'manga'}))
                ];
                filterMediaList();
            } catch(e) { console.log("Slow connection to API endpoints."); }
        }

        function filterMediaList() {
            const query = document.getElementById('anime-search').value.toLowerCase();
            const aList = document.getElementById('anime-api-list');
            const mList = document.getElementById('manga-api-list');
            
            let filtered = allAnimeMangaCached.filter(i => i.title.toLowerCase().includes(query));
            
            aList.innerHTML = filtered.filter(i => i.omniType === 'anime').map(item => `
                <a href="https://www.crunchyroll.com/search?q=${encodeURIComponent(item.title)}" target="_blank" class="api-card">
                    <img src="${item.images.jpg.image_url}">
                    <div class="api-card-details"><b>${item.title}</b></div>
                </a>
            `).join('');

            mList.innerHTML = filtered.filter(i => i.omniType === 'manga').map(item => `
                <a href="https://mangaplus.shueisha.co.jp/search?keyword=${encodeURIComponent(item.title)}" target="_blank" class="api-card">
                    <img src="${item.images.jpg.image_url}">
                    <div class="api-card-details"><b>${item.title}</b></div>
                </a>
            `).join('');
        }

        // 4. MUSIC CONTROLLER (TIKTOK PHONK, ANIME CUTE, JAPANESE, ENGLISH, TAGALOG)
        const globalTracks = [
            { title: "⚡ PHONK - Metamorphosis (TikTok Speed Up)", source: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "😈 PHONK - Brazilian Dança Phonk Track", source: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "🇺🇸 English Pop - Stay (TikTok Speed Mix)", source: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { title: "🇵🇭 OPM Hit - Raining In Manila (Trend Edit)", source: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
            { title: "🎸 OPM Pop - Ere (Popular TikTok Slowed)", source: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
            { title: "🇯🇵 J-Pop Hit - Idol / Yoasobi (Oshi No Ko Theme)", source: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" },
            { title: "🌸 Anime Cute - Renai Circulation Mix", source: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" }
        ];

        const audioPlayer = document.getElementById('core-audio-engine');

        // AUTO-NEXT ENGINE MECHANISM
        audioPlayer.onended = function() {
            playNextTrack();
        };

        function filterAudioList() {
            const query = document.getElementById('audio-search').value.toLowerCase();
            const container = document.getElementById('audio-list-container');
            
            container.innerHTML = globalTracks
                .filter(t => t.title.toLowerCase().includes(query))
                .map((track) => {
                    const realIndex = globalTracks.findIndex(t => t.title === track.title);
                    return `
                        <div class="audio-row">
                            <div><b>${track.title}</b></div>
                            <button onclick="launchTrack(${realIndex})" style="background:var(--success); border:none; color:black; padding:6px 12px; font-weight:bold; border-radius:4px; cursor:pointer;">▶ PLAY</button>
                        </div>
                    `;
                }).join('');
        }

        function launchTrack(index) {
            currentTrackIndex = index;
            const track = globalTracks[currentTrackIndex];
            audioPlayer.src = track.source;
            audioPlayer.play().catch(e => console.log("Interaction needed."));
            document.getElementById('now-playing-title').innerText = "Now Playing: " + track.title;
            document.getElementById('play-pause-toggle-btn').innerText = "⏸ Pause";
        }

        function togglePlayPause() {
            const btn = document.getElementById('play-pause-toggle-btn');
            if (audioPlayer.paused) {
                audioPlayer.play();
                btn.innerText = "⏸ Pause";
            } else {
                audioPlayer.pause();
                btn.innerText = "▶ Play";
            }
        }

        function playNextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % globalTracks.length;
            launchTrack(currentTrackIndex);
        }

        function playPreviousTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + globalTracks.length) % globalTracks.length;
            launchTrack(currentTrackIndex);
        }

        // ALL CRITICAL CORE TRIGGER SYSTEM ON LOAD
        document.addEventListener('DOMContentLoaded', () => {
            initProfile();
            startLiveChatSync();
            loadJikanAPI();
            filterAudioList();
        });
    </script>
</body>
</html>
