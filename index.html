<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="s1LpdFQDsO-k3mGLHAsP62N2V955khk8kZsyeon9G1M" />
    <title>OMNIVERSE | Absolute Authority</title>

    <style>
        :root { --bg: #050505; --panel: #111; --accent: #FF4500; --text: #FFF; --sub: #888; --border: #222; }
        .light-mode { --bg: #F5F5F5; --panel: #FFF; --accent: #E74C3C; --text: #111; --sub: #666; --border: #DDD; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* 🔱 HEADER */
        header { padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--accent); background: var(--panel); position: sticky; top: 0; z-index: 1000; }
        header h1 { font-size: 24px; color: var(--accent); letter-spacing: 5px; font-weight: 900; text-transform: uppercase; }
        .theme-toggle { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 11px; cursor: pointer; font-weight: bold; text-transform: uppercase; }

        /* 🔱 ANIME AUTO-SWIPE BANNER */
        .hero-banner { width: 100%; height: 400px; overflow: hidden; position: relative; border-bottom: 2px solid var(--accent); background: #000; }
        .banner-track { display: flex; width: 400%; height: 100%; animation: swipe 20s infinite; }
        .banner-track img { width: 25%; height: 100%; object-fit: cover; filter: brightness(0.5); }
        @keyframes swipe {
            0%, 20% { transform: translateX(0); }
            25%, 45% { transform: translateX(-25%); }
            50%, 70% { transform: translateX(-50%); }
            75%, 95% { transform: translateX(-75%); }
            100% { transform: translateX(0); }
        }
        .banner-text { position: absolute; bottom: 50px; left: 30px; z-index: 10; }
        .banner-text h2 { font-size: 40px; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 20px var(--accent); }

        /* 🔱 MAIN LAYOUT */
        .main-layout { display: flex; flex-wrap: wrap; padding: 30px; gap: 30px; max-width: 1600px; margin: 0 auto; }
        .intel-column { flex: 2.5; min-width: 350px; }
        .nexus-column { flex: 1; min-width: 320px; position: sticky; top: 100px; height: calc(100vh - 150px); }

        .section-label { font-size: 13px; font-weight: 900; color: var(--accent); text-transform: uppercase; margin: 30px 0 15px; border-left: 5px solid var(--accent); padding-left: 12px; letter-spacing: 2px; }

        /* 🔱 KUMPLETONG DETALYE CARDS */
        .omni-card { display: flex; gap: 20px; background: var(--panel); padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); text-decoration: none; color: inherit; transition: 0.3s; }
        .omni-card:hover { border-color: var(--accent); transform: translateX(10px); background: rgba(255,69,0,0.05); }
        .omni-card img { width: 120px; height: 170px; object-fit: cover; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .info { flex: 1; }
        .info h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: var(--text); }
        .meta-grid { display: grid; grid-template-columns: 1fr; gap: 5px; font-size: 12px; color: var(--sub); line-height: 1.4; }
        .meta-grid b { color: var(--accent); font-size: 10px; text-transform: uppercase; }
        .countdown-tag { margin-top: 10px; display: inline-block; padding: 4px 10px; background: rgba(0,255,0,0.1); border: 1px solid #00FF00; color: #00FF00; font-weight: bold; font-size: 10px; border-radius: 3px; }

        /* 🔱 REAL-TIME CHAT (NEXUS) */
        .nexus-chat { background: var(--panel); border: 1px solid var(--border); height: 100%; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #chat-flow { flex: 1; padding: 20px; overflow-y: auto; font-size: 13px; scroll-behavior: smooth; }
        .chat-ui { padding: 15px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); }
        .id-input { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 8px; color: var(--accent); border-radius: 5px; margin-bottom: 10px; font-weight: 900; outline: none; }
        .input-row { display: flex; gap: 10px; }
        .msg-input { flex: 1; background: var(--bg); border: 1px solid var(--border); padding: 12px; color: var(--text); border-radius: 5px; outline: none; }
        .send-btn { background: var(--accent); border: none; padding: 0 20px; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }

        @media (max-width: 950px) { .nexus-column { position: static; height: 500px; } .hero-banner { height: 250px; } }
    </style>
</head>
<body>

    <header>
        <h1>OMNIVERSE</h1>
        <button class="theme-toggle" onclick="swapTheme()">White / Black</button>
    </header>

    <div class="hero-banner">
        <div class="banner-track">
            <img src="https://images.unsplash.com/photo-1541876072-be623c44fc47?w=1200" alt="Anime 1">
            <img src="https://images.unsplash.com/photo-1578632738908-4521c726eec6?w=1200" alt="Anime 2">
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=1200" alt="Anime 3">
            <img src="https://images.unsplash.com/photo-1519661148489-4b9804001185?w=1200" alt="Anime 4">
        </div>
        <div class="banner-text">
            <div style="color:var(--accent); font-weight:900; font-size:12px; letter-spacing:3px;">GLOBAL SUPREME AUTHORITY</div>
            <h2>OMNIVERSE CORE</h2>
        </div>
    </div>

    <div class="main-layout">
        <div class="intel-column">
            <div class="section-label">Upcoming Anime Intel (Countdown)</div>
            <div id="upcoming-engine"></div>

            <div class="section-label">Top Manga, Manhwa & Manhua</div>
            <div id="manga-engine"></div>
        </div>

        <div class="nexus-column">
            <div class="section-label">Global Nexus (Identity Chat)</div>
            <div class="nexus-chat">
                <div id="chat-flow">
                    <div style="color:var(--accent); opacity:0.7;">[DATABASE]: Secure connection established...</div>
                </div>
                <div class="chat-ui">
                    <input type="text" id="nick" class="id-input" placeholder="Set Identity (Nickname)..." value="Boss">
                    <div class="input-row">
                        <input type="text" id="msg" class="msg-input" placeholder="Enter transmission...">
                        <button class="send-btn" onclick="transmit()">SEND</button>
                    </div>
                </div>
            </div>
            <div style="margin-top:20px; border:1px dashed var(--border); padding:15px; text-align:center; font-size:11px; color:var(--sub); border-radius:5px;">
                GOOGLE ADSENSE PARTNER SLOT (REVENUE ACTIVE)
            </div>
        </div>
    </div>

    <script>
        // 🔱 THEME ENGINE
        function swapTheme() { document.body.classList.toggle('light-mode'); }

        // 🔱 TRANSMISSION ENGINE (CHAT)
        function transmit() {
            const n = document.getElementById('nick').value || "Unknown";
            const m = document.getElementById('msg').value;
            const flow = document.getElementById('chat-flow');
            if(m) {
                flow.innerHTML += `<div><b style="color:var(--accent)">${n}:</b> ${m}</div>`;
                document.getElementById('msg').value = "";
                flow.scrollTop = flow.scrollHeight;
            }
        }

        // 🔱 GLOBAL DATA CORE (FULL INFO)
        async function runOmniEngine() {
            try {
                // Upcoming Anime Feed
                const aRes = await fetch('https://api.jikan.moe/v4/seasons/upcoming');
                const aData = await aRes.json();
                const uEng = document.getElementById('upcoming-engine');
                
                aData.data.slice(0, 12).forEach(item => {
                    uEng.innerHTML += `
                        <a href="${item.url}" target="_blank" class="omni-card">
                            <img src="${item.images.jpg.large_image_url}">
                            <div class="info">
                                <h3>${item.title}</h3>
                                <div class="meta-grid">
                                    <span><b>Studio:</b> ${item.studios[0]?.name || 'TBA Staff'}</span>
                                    <span><b>Source:</b> ${item.source || 'Original'}</span>
                                    <span><b>Info:</b> Voice Actors & Trailer in Full Portal</span>
                                </div>
                                <div class="countdown-tag">T-MINUS: SEASONAL PREMIERE</div>
                            </div>
                        </a>`;
                });

                // Top Manga/Manhwa/Manhua Feed
                const mRes = await fetch('https://api.jikan.moe/v4/top/manga');
                const mData = await mRes.json();
                const mEng = document.getElementById('manga-engine');

                mData.data.slice(0, 12).forEach(item => {
                    mEng.innerHTML += `
                        <a href="${item.url}" target="_blank" class="omni-card">
                            <img src="${item.images.jpg.large_image_url}">
                            <div class="info">
                                <h3>${item.title}</h3>
                                <div class="meta-grid">
                                    <span><b>Type:</b> ${item.type} | <b>Author:</b> ${item.authors[0]?.name || 'N/A'}</span>
                                    <span><b>Rank:</b> #${item.rank} | <b>Score:</b> ⭐ ${item.score}</span>
                                    <span><b>Status:</b> ${item.status}</span>
                                </div>
                                <div style="margin-top:8px; font-size:10px; color:var(--accent); font-weight:bold;">TECHNICAL DATA SYNCED</div>
                            </div>
                        </a>`;
                });
            } catch (e) { console.log("CORE ERROR: Connection interrupted."); }
        }

        runOmniEngine();
    </script>
</body>
                </html>
