<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="s1LpdFQDsO-k3mGLHAsP62N2V955khk8kZsyeon9G1M" />
    <title>OMNIVERSE | Supreme Authority</title>

    <style>
        :root { --bg: #050505; --panel: #111; --accent: #FF4500; --text: #FFF; --sub: #888; --border: #222; }
        .light-mode { --bg: #F0F0F0; --panel: #FFF; --accent: #E74C3C; --text: #111; --sub: #555; --border: #DDD; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* 🔱 HEADER */
        header { padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--accent); background: var(--panel); position: sticky; top: 0; z-index: 1000; }
        header h1 { font-size: 18px; color: var(--accent); letter-spacing: 3px; font-weight: 900; }
        
        .header-btns { display: flex; gap: 10px; align-items: center; }
        .theme-btn { background: var(--accent); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; font-weight: bold; }

        /* 🔱 AUTO-SWIPE BANNER */
        .banner { width: 100%; height: 250px; overflow: hidden; position: relative; border-bottom: 1px solid var(--border); }
        .banner-track { display: flex; width: 400%; height: 100%; animation: slide 16s infinite; }
        .banner-track img { width: 25%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        @keyframes slide { 0%, 20% { transform: translateX(0); } 25%, 45% { transform: translateX(-25%); } 50%, 70% { transform: translateX(-50%); } 75%, 95% { transform: translateX(-75%); } }

        /* 🔱 LAYOUT */
        .omni-layout { display: flex; flex-wrap: wrap; padding: 15px; gap: 15px; max-width: 1400px; margin: 0 auto; }
        .left-intel { flex: 2; min-width: 300px; }
        .right-nexus { flex: 1; min-width: 300px; position: sticky; top: 80px; height: calc(100vh - 100px); }

        .label { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin: 20px 0 10px; letter-spacing: 1px; display: block; border-left: 3px solid var(--accent); padding-left: 8px; }

        /* 🔱 CARDS */
        .card { display: flex; gap: 12px; background: var(--panel); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); text-decoration: none; color: inherit; }
        .card img { width: 80px; height: 120px; object-fit: cover; border-radius: 4px; }
        .card-info { flex: 1; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
        .card-meta { font-size: 11px; color: var(--sub); line-height: 1.4; }
        .countdown { font-size: 10px; color: #00FF00; font-weight: bold; margin-top: 5px; display: block; }

        /* 🔱 CHAT SYSTEM (WITH NICKNAME) */
        .nexus { background: var(--panel); border: 1px solid var(--border); height: 100%; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; }
        #chat-logs { flex: 1; padding: 15px; overflow-y: auto; font-size: 12px; }
        .chat-input-area { padding: 10px; background: rgba(0,0,0,0.1); border-top: 1px solid var(--border); }
        .nick-input { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 5px; color: var(--accent); border-radius: 4px; margin-bottom: 5px; font-size: 11px; font-weight: bold; }
        .msg-row { display: flex; gap: 5px; }
        .msg-input { flex: 1; background: var(--bg); border: 1px solid var(--border); padding: 8px; color: var(--text); border-radius: 4px; font-size: 12px; }
        .send-btn { background: var(--accent); border: none; padding: 0 15px; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }

        @media (max-width: 800px) { .right-nexus { position: static; height: 400px; } }
    </style>
</head>
<body>

    <header>
        <h1>OMNIVERSE</h1>
        <div class="header-btns">
            <button class="theme-btn" onclick="toggleTheme()">WHITE / BLACK</button>
        </div>
    </header>

    <div class="banner">
        <div class="banner-track">
            <img src="https://images.unsplash.com/photo-1578632738908-4521c726eec6?w=800" alt="Anime 1">
            <img src="https://images.unsplash.com/photo-1541876072-be623c44fc47?w=800" alt="Anime 2">
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=800" alt="Anime 3">
            <img src="https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=800" alt="Anime 4">
        </div>
    </div>

    <div class="omni-layout">
        <div class="left-intel">
            <span class="label">Upcoming Anime & Countdowns</span>
            <div id="upcoming-list"></div>
            
            <span class="label">Top Manga, Manhwa & Manhua</span>
            <div id="manga-list"></div>
        </div>

        <div class="right-nexus">
            <span class="label">Global Nexus Chat</span>
            <div class="nexus">
                <div id="chat-logs">
                    <div style="color:var(--accent)">[SYSTEM]: Identity required for chat access.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="user-nick" class="nick-input" placeholder="Set Nickname..." value="Boss">
                    <div class="msg-row">
                        <input type="text" id="user-msg" class="msg-input" placeholder="Enter message...">
                        <button class="send-btn" onclick="sendMessage()">SEND</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🔱 THEME TOGGLE (WHITE & BLACK)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // 🔱 CHAT ENGINE WITH NICKNAME
        function sendMessage() {
            const nick = document.getElementById('user-nick').value || "Guest";
            const msg = document.getElementById('user-msg').value;
            const logs = document.getElementById('chat-logs');

            if(msg) {
                logs.innerHTML += `<div><b style="color:var(--accent)">${nick}:</b> ${msg}</div>`;
                document.getElementById('user-msg').value = "";
                logs.scrollTop = logs.scrollHeight;
            }
        }

        // 🔱 DATA FETCHING (FULL DETAILS)
        async function fetchOmniData() {
            try {
                // Fetch Upcoming Anime
                const aRes = await fetch('https://api.jikan.moe/v4/seasons/upcoming');
                const aData = await aRes.json();
                const uList = document.getElementById('upcoming-list');
                
                aData.data.slice(0, 10).forEach(item => {
                    uList.innerHTML += `
                        <a href="${item.url}" target="_blank" class="card">
                            <img src="${item.images.jpg.image_url}">
                            <div class="card-info">
                                <div class="card-title">${item.title}</div>
                                <div class="card-meta">
                                    <b>Studio:</b> ${item.studios[0]?.name || 'TBA'}<br>
                                    <b>Source:</b> ${item.source}<br>
                                    <b>Staff:</b> Directors/VA available in Portal
                                </div>
                                <span class="countdown">PREMIERING NEXT SEASON</span>
                            </div>
                        </a>`;
                });

                // Fetch Top Manga/Manhwa/Manhua
                const mRes = await fetch('https://api.jikan.moe/v4/top/manga');
                const mData = await mRes.json();
                const mList = document.getElementById('manga-list');

                mData.data.slice(0, 10).forEach(item => {
                    mList.innerHTML += `
                        <a href="${item.url}" target="_blank" class="card">
                            <img src="${item.images.jpg.image_url}">
                            <div class="card-info">
                                <div class="card-title">${item.title}</div>
                                <div class="card-meta">
                                    <b>Author:</b> ${item.authors[0]?.name || 'N/A'}<br>
                                    <b>Type:</b> ${item.type} | <b>Rank:</b> #${item.rank}<br>
                                    <b>Score:</b> ⭐ ${item.score}
                                </div>
                            </div>
                        </a>`;
                });
            } catch (e) { console.log("Sync Error"); }
        }

        fetchOmniData();
    </script>
</body>
                    </html>
