<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE CORE | Global Anime News Network</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark-core: #07090e;
            --bg-panel-solid: #111520;
            --bg-input-focus: #020306;
            --color-brand-primary: #ff4757;
            --color-text-premium: #ffffff;
            --color-text-sub: #8b9bb4;
            --border-ui-glow: #1f2635;
            --premium-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
        }
        [data-theme="light"] {
            --bg-dark-core: #f5f6fa;
            --bg-panel-solid: #ffffff;
            --bg-input-focus: #ffffff;
            --color-text-premium: #2f3542;
            --color-text-sub: #747d8c;
            --border-ui-glow: #e4e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark-core); color: var(--color-text-premium); padding-bottom: 120px; overflow-x: hidden; }
        
        .app-header-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; background: rgba(18, 22, 32, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-ui-glow); z-index: 999; }
        .app-brand-identity { font-weight: 800; font-size: 1.4rem; letter-spacing: 1.5px; background: var(--premium-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .app-brand-dot { width: 8px; height: 8px; background: var(--color-brand-primary); border-radius: 50%; box-shadow: 0 0 10px var(--color-brand-primary); }

        .view-frame-section { display: none; padding: 24px 16px; max-width: 1400px; margin: 0 auto; animation: viewFadeIn 0.25s ease-in-out; }
        .view-frame-section.active-view { display: block; }
        @keyframes viewFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .search-input-field { width: 100%; padding: 16px 20px; background: var(--bg-panel-solid); border: 1px solid var(--border-ui-glow); color: var(--color-text-premium); border-radius: 12px; font-size: 0.95rem; margin-bottom: 20px; }
        .search-input-field:focus { border-color: var(--color-brand-primary); outline: none; }
        
        .filter-navigation-tabs { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px; }
        .ui-action-btn { background: var(--bg-panel-solid); border: 1px solid var(--border-ui-glow); color: var(--color-text-premium); padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .ui-action-btn.active-tab, .ui-action-btn:hover { background: var(--premium-gradient); border-color: transparent; color: white; }

        .content-display-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        @media (min-width: 480px) { .content-display-matrix { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; } }
        
        .premium-media-card { background: var(--bg-panel-solid); border-radius: 14px; overflow: hidden; border: 1px solid var(--border-ui-glow); display: flex; flex-direction: column; cursor: pointer; transition: all 0.25s ease; }
        .premium-media-card:hover { transform: translateY(-5px); border-color: var(--color-brand-primary); }
        .premium-media-card img { width: 100%; aspect-ratio: 11/16; object-fit: cover; }
        .card-metadata-area { padding: 14px; }
        .card-data-title { font-weight: 700; font-size: 0.9rem; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-data-badge { display: inline-block; padding: 3px 8px; background: rgba(255, 71, 87, 0.1); color: var(--color-brand-primary); font-size: 0.7rem; font-weight: 700; border-radius: 6px; text-transform: uppercase; }

        /* FULL DETAILS MODAL SYSTEM (FIXED EYE) */
        .overlay-modal-view { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
        .modal-body-container { background: var(--bg-panel-solid); border: 1px solid var(--border-ui-glow); padding: 24px; border-radius: 20px; max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-dismiss-trigger { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--color-text-sub); cursor: pointer; font-size: 1.3rem; }
        
        .news-article-card { background: var(--bg-panel-solid); border: 1px solid var(--border-ui-glow); border-radius: 14px; padding: 20px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
        .countdown-timer-span { font-family: monospace; font-weight: bold; color: var(--color-brand-primary); font-size: 1.1rem; background: rgba(255,71,87,0.06); padding: 6px 12px; border-radius: 6px; display: inline-block; width: fit-content; }
        
        .vector-icon-root { width: 18px; height: 18px; fill: currentColor; display: inline-block; vertical-align: middle; }
    </style>
    <style>
        .network-chat-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .network-chat-grid { grid-template-columns: 260px 1fr; } }
        .sidebar-channels-panel { display: flex; flex-direction: column; gap: 12px; }
        .channel-selector-card { background: var(--bg-panel-solid); border: 1px solid var(--border-ui-glow); border-radius: 12px; padding: 16px; cursor: pointer; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 12px; }
        .channel-selector-card.active-channel-node { border-color: var(--color-brand-primary); background: rgba(255, 71, 87, 0.05); }
        .active-cloud-users-container { background: var(--bg-panel-solid); padding: 16px; border-radius: 14px; border: 1px solid var(--border-ui-glow); max-height: 300px; overflow-y: auto; }
        .cloud-user-row { padding: 12px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: rgba(255,255,255,0.01); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .cloud-user-row.active-pm-node { border-color: var(--color-brand-primary); background: rgba(255,71,87,0.03); }
        .network-online-indicator { width: 8px; height: 8px; background: #2ed573; border-radius: 50%; }

        .terminal-chat-main-wrapper { background: var(--bg-panel-solid); border-radius: 14px; border: 1px solid var(--border-ui-glow); display: flex; flex-direction: column; overflow: hidden; height: 480px; }
        .terminal-messages-stream { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg-bubble-node { background: rgba(255,255,255,0.02); border: 1px solid var(--border-ui-glow); padding: 12px 16px; border-radius: 12px; max-width: 80%; width: fit-content; }
        .chat-msg-bubble-node.origin-self { align-self: flex-end; border-color: var(--color-brand-primary); }
        .terminal-input-controls-bar { display: flex; padding: 12px; gap: 10px; background: rgba(0,0,0,0.1); border-top: 1px solid var(--border-ui-glow); }
        .terminal-input-controls-bar input { flex: 1; padding: 14px; background: var(--bg-input-focus); border: 1px solid var(--border-ui-glow); color: var(--color-text-premium); border-radius: 8px; }
        .terminal-send-btn { background: var(--premium-gradient); border: none; color: white; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .gateway-lockout-backdrop { background: rgba(6,7,9,0.98); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .gateway-profile-card { background: var(--bg-panel-solid); border: 1px solid var(--border-ui-glow); padding: 36px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; }

        .bottom-navigation-dock-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-panel-solid); display: flex; justify-content: space-around; padding: 14px 0; border-top: 1px solid var(--border-ui-glow); z-index: 1000; height: 75px; }
        .dock-nav-trigger-node { background: none; border: none; color: var(--color-text-sub); font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; width: 80px; font-weight: 600; }
        .dock-nav-trigger-node.active-nav-node { color: var(--color-brand-primary); }
    </style>
</head>
<body>

    <div id="identity-interceptor" class="gateway-lockout-backdrop">
        <div class="gateway-profile-card">
            <h3 style="margin-bottom: 12px;">Create Network Identity</h3>
            <input type="text" id="lockout-username-field" class="search-input-field" style="text-align:center;" placeholder="Enter secure nickname...">
            <button class="ui-action-btn" style="width:100%;" onclick="saveGatekeeperIdentity()">LAUNCH OMNIVERSE</button>
        </div>
    </div>

    <div class="app-header-bar">
        <div class="app-brand-identity"><span class="app-brand-dot"></span>OMNIVERSE CORE</div>
        <button class="ui-action-btn" onclick="toggleThemeCore()">Interface Shift</button>
    </div>

    <div id="home-view" class="view-frame-section active-view">
        <input type="text" id="media-search" class="search-input-field" placeholder="🔍 Search Database (Anime, Manga, Manhwa, Manhua)..." oninput="filterMediaMatrix()">
        <div class="filter-navigation-tabs">
            <button class="ui-action-btn active-tab" onclick="setMediaClass('anime', this)">Anime Matrix</button>
            <button class="ui-action-btn" onclick="setMediaClass('manga', this)">Manga & Books</button>
        </div>
        <div id="media-grid-display" class="content-display-matrix"></div>
    </div>

    <div id="chat-view" class="view-frame-section">
        <div class="network-chat-grid">
            <div class="sidebar-channels-panel">
                <div onclick="switchToGlobalRoom()" id="global-room-tab" class="channel-selector-card active-channel-node">
                    <svg class="vector-icon-root" viewBox="0 0 24 24"><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>
                    <span>Global Chatroom</span>
                </div>
                <div id="pm-users-list" class="active-cloud-users-container"></div>
            </div>
            <div class="terminal-chat-main-wrapper">
                <div id="active-chat-header" style="padding:16px; background:rgba(0,0,0,0.1); font-weight:700; color:var(--color-brand-primary); border-bottom:1px solid var(--border-ui-glow);">PORT: GLOBAL_FEED</div>
                <div class="terminal-messages-stream" id="chat-messages-container"></div>
                <div class="terminal-input-controls-bar">
                    <input type="text" id="chat-message-input" placeholder="Type safe message...">
                    <button class="terminal-send-btn" onclick="sendOmniChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="news-view" class="view-frame-section">
        <h2 style="margin-bottom: 20px; background: var(--premium-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Upcoming Broadcast Countdown & Trailers</h2>
        <div id="news-feed-container"></div>
    </div>

    <div class="overlay-modal-view" id="media-details-modal" onclick="closeMediaModal()">
        <div class="modal-body-container" onclick="event.stopPropagation()">
            <button class="modal-dismiss-trigger" onclick="closeMediaModal()">✕</button>
            <div id="modal-injector-content"></div>
        </div>
    </div>

    <div class="bottom-navigation-dock-panel">
        <button class="dock-nav-trigger-node active-nav-node" onclick="routeTo('home', this)">
            <svg class="vector-icon-root" viewBox="0 0 24 24"><path d='M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z'/></svg>
            <span>Database</span>
        </button>
        <button class="dock-nav-trigger-node" onclick="routeTo('chat', this)">
            <svg class="vector-icon-root" viewBox="0 0 24 24"><path d='M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z'/></svg>
            <span>Chat Network</span>
        </button>
        <button class="dock-nav-trigger-node" onclick="routeTo('news', this)">
            <svg class="vector-icon-root" viewBox="0 0 24 24"><path d='M20 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2zm-1 16H5V5h14v14zm-2-5H7v-2h10v2zm-4-4H7V6h6v2z'/></svg>
            <span>News Feed</span>
        </button>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let localProfileName = localStorage.getItem('omni_v3_name') || "";
        let targetChatRoom = "Global";
        let activeDataEngineClass = "anime";
        let mediaCacheBlock = [];

        // 🛑 WORD CENSOR BLACKLIST SYSTEM (BAN SYSTEM PARA SA MURA O BASTOS NA PROFILE/CHAT)
        const chatWordBlacklist = ["gago", "putangina", "pota", "tarantado", "siraulo", "pakyu", "bobo", "ulol"];

        function cleanBadLanguageFilter(textInput) {
            let filteredText = textInput;
            chatWordBlacklist.forEach(badWord => {
                let regularExpression = new RegExp(badWord, "gi");
                filteredText = filteredText.replace(regularExpression, "****");
            });
            return filteredText;
        }

        function verifyIdentityRequirements() {
            if (localProfileName) {
                localProfileName = cleanBadLanguageFilter(localProfileName);
                document.getElementById('identity-interceptor').style.display = 'none';
                database.ref('users/' + localProfileName).set({ heartbeat: Date.now() });
            } else {
                document.getElementById('identity-interceptor').style.display = 'flex';
            }
        }

        function saveGatekeeperIdentity() {
            const nameInput = document.getElementById('lockout-username-field').value.trim();
            if(!nameInput) return alert("Nickname required.");
            localProfileName = cleanBadLanguageFilter(nameInput);
            localStorage.setItem('omni_v3_name', localProfileName);
            verifyIdentityRequirements();
        }

        function routeTo(viewId, element) {
            document.querySelectorAll('.view-frame-section').forEach(v => v.classList.remove('active-view'));
            document.querySelectorAll('.dock-nav-trigger-node').forEach(b => b.classList.remove('active-nav-node'));
            document.getElementById(viewId + '-view').classList.add('active-view');
            element.classList.add('active-nav-node');
        }

        function startLiveChatRouter() {
            database.ref('global_broadcast_messages').limitToLast(50).on('value', snap => {
                if(targetChatRoom === "Global") renderChatBubbles(snap.val());
            });
            database.ref('users').on('value', snap => {
                const users = snap.val() || {};
                const pmBox = document.getElementById('pm-users-list');
                pmBox.innerHTML = '';
                for(let u in users) {
                    if(u !== localProfileName) {
                        pmBox.innerHTML += `<div class="cloud-user-row" onclick="switchToPrivateMessage('${u}')"><span>👤 ${u}</span><span class="network-online-indicator"></span></div>`;
                    }
                }
            });
        }

        function switchToGlobalRoom() {
            targetChatRoom = "Global";
            document.getElementById('active-chat-header').innerText = "PORT: GLOBAL_FEED";
            database.ref('global_broadcast_messages').limitToLast(50).once('value', s => renderChatBubbles(s.val()));
        }

        function switchToPrivateMessage(userTarget) {
            targetChatRoom = userTarget;
            document.getElementById('active-chat-header').innerText = `SECURE LINE: @${userTarget}`;
            const tunnel = [localProfileName, userTarget].sort().join("_pmchannel_");
            database.ref('private_tunnels/' + tunnel).limitToLast(50).on('value', snap => {
                if(targetChatRoom === userTarget) renderChatBubbles(snap.val());
            });
        }

        function renderChatBubbles(data) {
            const container = document.getElementById('chat-messages-container');
            container.innerHTML = '';
            if(!data) return;
            for(let k in data) {
                const isSelf = data[k].sender === localProfileName ? 'origin-self' : '';
                let cleanMessage = cleanBadLanguageFilter(data[k].text);
                container.innerHTML += `<div class="chat-msg-bubble-node ${isSelf}"><strong>${data[k].sender}:</strong> ${cleanMessage}</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function sendOmniChatMessage() {
            const input = document.getElementById('chat-message-input');
            if(!input.value.trim()) return;
            let filteredPayload = cleanBadLanguageFilter(input.value.trim());
            const packet = { sender: localProfileName, text: filteredPayload, epochTime: Date.now() };
            if(targetChatRoom === "Global") {
                database.ref('global_broadcast_messages').push(packet);
            } else {
                const tunnel = [localProfileName, targetChatRoom].sort().join("_pmchannel_");
                database.ref('private_tunnels/' + tunnel).push(packet);
            }
            input.value = '';
        }

        // FETCH FROM DIRECT JAPAN PIPELINE VIA MAL API
        async function fetchJikanCloudFeeds() {
            try {
                let endpoint = activeDataEngineClass === "anime" ? 'https://api.jikan.moe/v4/top/anime?limit=24' : 'https://api.jikan.moe/v4/top/manga?limit=24';
                const res = await (await fetch(endpoint)).json();
                mediaCacheBlock = res.data;
                filterMediaMatrix();
            } catch(e) {}
        }

        function setMediaClass(classType, element) {
            document.querySelectorAll('.filter-navigation-tabs .ui-action-btn').forEach(b => b.classList.remove('active-tab'));
            element.classList.add('active-tab');
            activeDataEngineClass = classType;
            fetchJikanCloudFeeds();
        }

        function filterMediaMatrix() {
            const searchKeyword = document.getElementById('media-search').value.toLowerCase();
            const grid = document.getElementById('media-grid-display');
            let dataset = mediaCacheBlock.filter(item => (item.title || "").toLowerCase().includes(searchKeyword));
            
            grid.innerHTML = dataset.map((item, index) => `
                <div class="premium-media-card" onclick="openMediaModalDetails(${index})">
                    <img src="${item.images?.jpg?.image_url || ''}">
                    <div class="card-metadata-area">
                        <div class="card-data-title">${item.title}</div>
                        <div class="card-data-badge">${item.type || activeDataEngineClass}</div>
                    </div>
                </div>
            `).join('');
        }

        // FIXED POP-UP MODAL MECHANICS (MIND EYE WORK)
        function openMediaModalDetails(indexNum) {
            const dataItem = mediaCacheBlock[indexNum];
            const modal = document.getElementById('media-details-modal');
            const injector = document.getElementById('modal-injector-content');
            
            injector.innerHTML = `
                <h2 style="color:var(--color-brand-primary); margin-bottom:12px;">${dataItem.title}</h2>
                <p style="font-size:0.75rem; color:var(--color-text-sub); margin-bottom:16px;">English Title: ${dataItem.title_english || 'N/A'}</p>
                <div style="display:flex; gap:16px; margin-bottom:16px;">
                    <img src="${dataItem.images?.jpg?.image_url || ''}" style="width:120px; border-radius:8px;">
                    <div style="font-size:0.85rem; line-height:1.6;">
                        <div><strong>Rank:</strong> #${dataItem.rank || 'N/A'}</div>
                        <div><strong>Score:</strong> ⭐ ${dataItem.score || 'N/A'}</div>
                        <div><strong>Status:</strong> ${dataItem.status || 'N/A'}</div>
                        <div><strong>Episodes/Chapters:</strong> ${dataItem.episodes || dataItem.chapters || 'Ongoing'}</div>
                    </div>
                </div>
                <h4 style="margin-bottom:6px;">Synopsis / Story Details:</h4>
                <p style="font-size:0.85rem; color:var(--color-text-sub); line-height:1.5; text-align:justify; max-height:150px; overflow-y:auto; padding-right:6px;">${dataItem.synopsis || 'No background summary registered.'}</p>
            `;
            modal.style.display = "flex";
        }

        function closeMediaModal() {
            document.getElementById('media-details-modal').style.display = "none";
        }

        // REALTIME UPCOMING NEWS FEED GENERATOR (COUNTDOWNS)
        async function loadAnimeNewsChannelFeed() {
            try {
                const upres = await (await fetch('https://api.jikan.moe/v4/seasons/upcoming?limit=6')).json();
                const container = document.getElementById('news-feed-container');
                
                container.innerHTML = upres.data.map(item => `
                    <div class="news-article-card">
                        <h3 style="color: var(--color-text-premium); font-size:1.1rem;">[UPCOMING BROADCAST] ${item.title}</h3>
                        <p style="font-size:0.85rem; color: var(--color-text-sub);">${item.synopsis ? item.synopsis.substring(0, 180) + '...' : 'No data.'}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; flex-wrap:wrap; gap:10px;">
                            <span class="countdown-timer-span">PREMIERE TBD (Japan System)</span>
                            <a href="${item.trailer?.url || '#'}" target="_blank" class="ui-action-btn" style="text-decoration:none; text-align:center;">WATCH OFFICIAL TRAILER</a>
                        </div>
                    </div>
                `).join('');
            } catch(e) {}
        }

        function toggleThemeCore() { document.body.toggleAttribute('data-theme'); }

        document.addEventListener('DOMContentLoaded', () => {
            verifyIdentityRequirements();
            startLiveChatRouter();
            fetchJikanCloudFeeds();
            loadAnimeNewsChannelFeed();
        });
    </script>
</body>
</html>
