<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg: #040408;
            --surface: #0c0c12;
            --text: #ffffff;
            --text-dim: #707080;
            --accent: #ff0055;
            --border: #141420;
            --card-bg: #09090e;
        }
        body.light-mode {
            --bg: #f4f4f9;
            --surface: #ffffff;
            --text: #121214;
            --text-dim: #606070;
            --accent: #e6004c;
            --border: #e0e0ea;
            --card-bg: #fcfcfd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; padding-bottom: 70px; }
        .app-container { max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER BAR */
        .app-header-node { background: var(--surface); border-bottom: 1px solid var(--border); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand-cluster { display: flex; align-items: center; gap: 8px; }
        .glow-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
        .brand-cluster h1 { font-size: 18px; font-weight: 900; letter-spacing: 1.5px; }
        .icon-btn-node { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text); }

        /* HERO BANNER */
        .hero-banner-slider { width: 100%; height: 230px; overflow: hidden; position: relative; background: #000; border-bottom: 1px solid var(--border); }
        .slider-track { display: flex; width: 400%; height: 100%; transition: transform 0.6s ease-in-out; }
        .slide-frame { width: 25%; height: 100%; position: relative; flex-shrink: 0; }
        .slide-frame img { width: 100%; height: 100%; object-fit: cover; }
        .slide-gradient { position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 15px 15px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); color: #fff; font-size: 16px; font-weight: bold; }

        /* VIEWPORT CONFIG */
        .viewport-canvas { padding: 15px; flex: 1; }
        .view-panel { display: none; }
        .view-panel.active-panel { display: block; }
        .section-title-bar { margin: 15px 0 10px; font-size: 14px; letter-spacing: 0.5px; color: var(--text); font-weight: bold; }

        /* CARD ARCHITECTURE */
        .grid-feed-layout { display: flex; flex-direction: column; gap: 15px; }
        .app-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
        .card-body-core { display: flex; padding: 12px; gap: 12px; }
        .card-media-box { width: 85px; height: 120px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #111; }
        .card-media-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-meta-pane { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .card-meta-pane h3 { font-size: 14px; font-weight: bold; line-height: 1.3; color: var(--text); }
        .info-row { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
        .deep-details-drawer { background: rgba(0,0,0,0.15); padding: 8px 12px; border-top: 1px dashed var(--border); border-radius: 4px; margin-top: 4px; }
        body.light-mode .deep-details-drawer { background: rgba(0,0,0,0.04); }
        .va-text-highlight { color: var(--text); font-weight: 500; }
        .card-footer-actions { display: flex; border-top: 1px solid var(--border); background: rgba(0,0,0,0.1); }
        .btn-action-trigger { flex: 1; padding: 10px; background: none; border: none; text-align: center; color: var(--text); font-size: 11px; font-weight: bold; text-decoration: none; cursor: pointer; transition: background 0.2s; }
        .btn-action-trigger:first-child { border-right: 1px solid var(--border); }
        .btn-action-trigger:hover { background: rgba(255,255,255,0.05); }

        /* SEARCH INTERFACE */
        .search-wrapper-node { display: flex; gap: 8px; }
        .search-wrapper-node input, .music-search-box input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; outline: none; transition: background 0.2s, color 0.2s; }
        .search-wrapper-node button { padding: 0 15px; border-radius: 10px; background: var(--accent); border: none; color: white; cursor: pointer; }

        /* NAVIGATION SYSTEM */
        .navigation-dock-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; height: 60px; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 100; }
        .nav-item-node { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; gap: 2px; }
        .nav-item-node span { font-size: 10px; font-weight: bold; }
        .nav-item-node.tab-active { color: var(--accent); }

        /* CHAT SYSTEMS */
        .chat-interface-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; height: calc(100vh - 170px); display: flex; flex-direction: column; overflow: hidden; }
        .chat-tab-row { display: flex; border-bottom: 1px solid var(--border); }
        .chat-tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--text-dim); font-size: 12px; font-weight: bold; cursor: pointer; }
        .chat-tab-btn.active-chat-tab { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(255,255,255,0.01); }
        .chat-logs-viewport { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.1); }
        .chat-bubble-row { display: flex; gap: 10px; align-items: flex-start; animation: fadeUp 0.3s ease; }
        .chat-user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: #222; flex-shrink: 0; }
        .chat-msg-container { flex: 1; background: var(--card-bg); border: 1px solid var(--border); padding: 10px; border-radius: 12px; min-width: 0; }
        .chat-meta-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; }
        .chat-meta-header b { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
        .badge-system { padding: 1px 5px; font-size: 8px; font-weight: 900; border-radius: 4px; color: #fff; text-transform: uppercase; }
        .badge-member { background: #555; } .badge-otaku { background: #0088cc; } .badge-hacker { background: #00cc66; } .badge-vip { background: #cc00cc; }
        .chat-bubble-payload { font-size: 13px; color: var(--text); line-height: 1.4; word-break: break-word; }
        .chat-input-dock { padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--border); background: var(--surface); }
        .chat-input-dock input { flex: 1; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; outline: none; }
        .chat-input-dock button { width: 45px; background: var(--accent); border: none; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; }

        /* CONFIG SETTINGS */
        .settings-card-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .control-group-node { display: flex; flex-direction: column; gap: 5px; }
        .control-group-node label { font-size: 11px; color: var(--text-dim); font-weight: bold; }
        .control-group-node input, .control-group-node select { padding: 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--text); outline: none; font-size: 13px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .is-spinning { animation: spin 4s linear infinite; }

        /* MODALS */
        .video-modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:500; padding:15px; }
        .video-modal-container { width:100%; max-width:500px; background:#000; border-radius:12px; overflow:hidden; position:relative; aspect-ratio:16/9; }
        .video-modal-container iframe { width:100%; height:100%; border:none; }
        .close-modal-trigger { position:absolute; top:8px; right:12px; color:#fff; font-size:24px; font-weight:bold; cursor:pointer; z-index:10; text-shadow:0 2px 4px #000; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header-node">
            <div class="brand-cluster">
                <div class="glow-dot"></div>
                <h1>OMNIVERSE</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn-node" onclick="window.toggleInterfaceMode()">🌓</button>
            </div>
        </header>

        <main class="viewport-canvas">
            
            <div id="panel-home" class="view-panel active-panel">
                <div class="hero-banner-slider">
                    <div class="slider-track" id="slider-track"></div>
                </div>
                <div class="section-title-bar">
                    <h2>🔥 UPCOMING SEASONS</h2>
                </div>
                <div class="grid-feed-layout" id="upcoming-feed"></div>
                <div class="section-title-bar" style="margin-top: 25px;">
                    <h2>📖 TOP MANGA ARCHIVES</h2>
                </div>
                <div class="grid-feed-layout" id="manga-feed"></div>
            </div>

            <div id="panel-explore" class="view-panel">
                <div class="search-wrapper-node">
                    <input type="text" id="searchInput" placeholder="Search anime title matrix...">
                    <button onclick="window.search()">🔍</button>
                </div>
                <div class="grid-feed-layout" id="explore-feed" style="margin-top:20px;"></div>
            </div>

            <div id="panel-chat" class="view-panel">
                <div class="chat-interface-box">
                    <div class="chat-tab-row">
                        <button id="chat-tab-global" class="chat-tab-btn active-chat-tab" onclick="window.switchChatMode('global')">🌐 Global Matrix</button>
                        <button id="chat-tab-pm" class="chat-tab-btn" onclick="window.switchChatMode('pm')">🔒 PM: Secure Node</button>
                    </div>
                    <div class="chat-logs-viewport" id="logs"></div>
                    <div class="chat-input-dock">
                        <input type="text" id="msg" placeholder="Transmit encrypted payload..." onkeydown="if(event.key==='Enter') window.sendMsg()">
                        <button onclick="window.sendMsg()">⚡</button>
                    </div>
                </div>
            </div>

            <div id="panel-audio" class="view-panel">
                <div class="music-player-card" style="background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); text-align: center; max-width: 500px; margin: 0 auto;">
                    <div class="disc-wrapper" style="margin-bottom: 20px; display: flex; justify-content: center;">
                        <div class="music-disc-node" id="musicDisc" style="width: 130px; height: 130px; border-radius: 50%; background: #0c0c12; border: 4px solid var(--accent); position: relative; display: flex; align-items: center; justify-content: center;">
                            <div class="disc-center-core" style="width: 35px; height: 35px; border-radius: 50%; background: var(--surface); border: 2px solid #222;"></div>
                        </div>
                    </div>
                    <div class="music-meta-block">
                        <h2 id="musicTitle" style="font-size:14px; color:var(--text); margin-bottom:4px; font-weight: bold;">🎵 Select a track or search below...</h2>
                        <p style="font-size:11px; color:var(--text-dim); margin-bottom:15px;">Omniverse Audio Deck Interface</p>
                    </div>
                    <div style="display:flex; justify-content:center; gap:20px; align-items:center; margin-bottom:20px;">
                        <button class="player-btn" onclick="window.toggleMusic()" id="playIconSvg" style="width:50px; height:50px; border-radius:50%; background:var(--accent); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;">
                            <svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:currentColor;"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="player-btn" onclick="window.nextMusic()" style="width:40px; height:40px; border-radius:50%; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text);">
                            <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor;"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>
                    <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
                    <div class="music-search-box" style="text-align: left;">
                        <label style="font-size:11px; color:var(--accent); font-weight:bold; letter-spacing:1px; display:block; margin-bottom:5px;">OMNIVERSE DECK SEARCH</label>
                        <div style="display:flex; gap:5px; margin-bottom:10px;">
                            <input type="text" id="musicSearchInput" placeholder="Type Phonk, Anime, TikTok, Tagalog...">
                            <button onclick="window.searchMusicDatabase()" style="padding:0 15px; border-radius:8px; background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:bold; font-size:13px; flex-shrink:0;">🔍 SEARCH</button>
                        </div>
                        <div id="musicSearchResultsPane" style="max-height:160px; overflow-y:auto; background:rgba(0,0,0,0.1); border-radius:8px; border:1px solid var(--border); padding:5px;">
                            <div style="padding:15px; text-align:center; color:var(--text-dim); font-size:12px;">Search results will load here. Try "Phonk"!</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="panel-settings" class="view-panel">
                <div class="settings-card-box">
                    <h2>⚙️ USER TERMINAL CONFIG</h2>
                    <div style="display:flex; justify-content:center; margin:15px 0;">
                        <img id="avatarPreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm0-4h-2V7h2v8z'/></svg>" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--accent);">
                    </div>
                    <div class="control-group-node">
                        <label>Matrix Alias / Nickname</label>
                        <input type="text" id="nick" value="Guest Node" onchange="window.saveProfileSettings()">
                    </div>
                    <div class="control-group-node">
                        <label>System Identification Badge</label>
                        <select id="userBadge" onchange="window.saveProfileSettings()">
                            <option value="member">⚡ MEMBER NODE</option>
                            <option value="otaku">🎐 OTAKU PILOT</option>
                            <option value="hacker">💻 MATRIX HACKER</option>
                            <option value="vip">💎 ELITE VIP</option>
                        </select>
                    </div>
                    <div class="control-group-node">
                        <label>Terminal Avatar Data (Max 300KB)</label>
                        <input type="file" id="fileInput" accept="image/*" style="background:transparent; border:none; padding:0;">
                    </div>
                </div>
            </div>
        </main>

        <nav class="navigation-dock-bar">
            <button id="tab-btn-home" class="nav-item-node tab-active" onclick="window.switchAppView('home')">🏠<span>Home</span></button>
            <button id="tab-btn-explore" class="nav-item-node" onclick="window.switchAppView('explore')">🔍<span>Explore</span></button>
            <button id="tab-btn-chat" class="nav-item-node" onclick="window.switchAppView('chat')">💬<span>Matrix</span></button>
            <button id="tab-btn-audio" class="nav-item-node" onclick="window.switchAppView('audio')">🎵<span>Audio</span></button>
            <button id="tab-btn-settings" class="nav-item-node" onclick="window.switchAppView('settings')">⚙️<span>Config</span></button>
        </nav>
    </div>

    <audio id="mainAudio" crossorigin="anonymous"></audio>
    <div class="video-modal-overlay" id="videoModal" onclick="window.closeVideo()">
        <div class="video-modal-container" onclick="event.stopPropagation()">
            <span class="close-modal-trigger" onclick="window.closeVideo()">×</span>
            <iframe id="videoIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>
    <script>
        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23888'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm0-4h-2V7h2v8z'/></svg>";
        let userAvatarBase64 = defaultAvatar; let currentSlide = 0; let slideInterval;
        let globalChatRef, privateChatRef, currentChatMode = 'global', activePmTargetNode = '';
        
        // GUMAGANANG MGA LIVE STREAM RADIO PARA SA MGA BACKUP TRACKS
        const tracks = [
            { title: "🎵 Live Node 1: J-Pop & Anime Top Hits", url: "https://stream.zeno.fm/03w7v6w37fevv" },
            { title: "🎵 Live Node 2: Trending TikTok & Phonk Station", url: "https://stream.zeno.fm/0v8g78p37fevv" }
        ];
        let currentTrackIdx = 0;

        if (localStorage.getItem('omniverse_theme') === 'light') { document.body.classList.add('light-mode'); }
        window.toggleInterfaceMode = function() { 
            document.body.classList.toggle('light-mode'); 
            localStorage.setItem('omniverse_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); 
        };
        function sanitize(str) { return str ? str.replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
        
        window.switchAppView = function(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active-panel'));
            document.querySelectorAll('.nav-item-node').forEach(t => t.classList.remove('tab-active'));
            document.getElementById(`panel-${viewId}`).classList.add('active-panel');
            document.getElementById(`tab-btn-${viewId}`).classList.add('tab-active');
            if(viewId === 'chat') { setTimeout(scrollChat, 50); }
        };

        // STREAM CONTROLLER
        window.toggleMusic = function() {
            const aud = document.getElementById('mainAudio'), disc = document.getElementById('musicDisc'), icon = document.getElementById('playIconSvg');
            if (!aud.src || aud.src === "" || aud.src.includes(window.location.hostname)) { aud.src = tracks[currentTrackIdx].url; }
            if (aud.paused) { 
                aud.load();
                aud.play().then(() => { 
                    disc.classList.add('is-spinning'); 
                    icon.innerHTML = `<svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:currentColor;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`; 
                }).catch(() => {
                    setTimeout(() => { aud.play(); disc.classList.add('is-spinning'); }, 300);
                });
            } else { aud.pause(); disc.classList.remove('is-spinning'); icon.innerHTML = `<svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:currentColor;"><path d="M8 5v14l11-7z"/></svg>`; }
        };

        window.nextMusic = function() { 
            currentTrackIdx = (currentTrackIdx + 1) % tracks.length; 
            document.getElementById('musicTitle').innerText = tracks[currentTrackIdx].title; 
            window.playSelectedTrack(tracks[currentTrackIdx].title, tracks[currentTrackIdx].url);
        };

        // SUPER ULTRA FAST SEARCH ENGINE (NO CORS ERROR / NO LOADING LOOP)
        window.searchMusicDatabase = async function() {
            const query = document.getElementById('musicSearchInput')?.value || "phonk";
            const resultsBox = document.getElementById('musicSearchResultsPane');
            if(!resultsBox) return;
            
            resultsBox.innerHTML = '<div style="padding:15px; text-align:center; color:var(--accent); font-size:13px;">Searching Apple Cloud Arrays...</div>';
            
            try {
                // Diretsong JSONP/Fetch sa Apple iTunes API - Walang block at super bilis!
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=12`);
                if (!response.ok) throw new Error('Network fail');
                const data = await response.json();
                
                resultsBox.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    data.results.forEach(song => {
                        if(!song.previewUrl) return; // Siguraduhing may gumaganang audio link
                        
                        const trackName = song.trackName || "Unknown Track";
                        const artistName = song.artistName || "Unknown Artist";
                        const coverArt = song.artworkUrl60 || 'https://images.alphacoders.com/112/1128711.jpg';
                        
                        resultsBox.innerHTML += `
                            <div onclick="window.playSelectedTrack('${sanitize(trackName)} - ${sanitize(artistName)}', '${song.previewUrl}')" style="display:flex; align-items:center; justify-content:space-between; padding:10px; border-bottom:1px solid var(--border); cursor:pointer;">
                                <div style="display:flex; align-items:center; gap:10px; text-align:left; min-width:0;">
                                    <img src="${coverArt}" style="width:38px; height:38px; border-radius:6px; object-fit:cover; flex-shrink:0; border:1px solid var(--border);">
                                    <div style="min-width:0;">
                                        <div style="color:var(--text); font-size:13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:210px;">${sanitize(trackName)}</div>
                                        <div style="color:var(--text-dim); font-size:11px;">${sanitize(artistName)}</div>
                                    </div>
                                </div>
                                <span style="color:var(--accent); font-size:11px; font-weight:bold; flex-shrink:0; padding:4px 8px; background:rgba(255,0,85,0.1); border-radius:4px;">▶ PLAY</span>
                            </div>
                        `;
                    });
                } else { 
                    resultsBox.innerHTML = '<div style="padding:15px; text-align:center; color:var(--text-dim); font-size:12px;">No free audio links found.</div>'; 
                }
            } catch(e) { 
                resultsBox.innerHTML = '<div style="padding:15px; text-align:center; color:var(--text-dim); font-size:12px;">Cloud tight. Re-trying query grid...</div>'; 
            }
        };

        window.playSelectedTrack = function(title, streamUrl) {
            const aud = document.getElementById('mainAudio');
            document.getElementById('musicTitle').innerText = title;
            aud.src = streamUrl; aud.load();
            aud.play().then(() => {
                document.getElementById('musicDisc').classList.add('is-spinning');
                document.getElementById('playIconSvg').innerHTML = `<svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:currentColor;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            }).catch(() => {});
        };

        // CHAT MATRIX ARCHITECTURE
        function getMyName() { return localStorage.getItem('omniverse_nick') || "Guest Node"; }
        function scrollChat() { const l = document.getElementById('logs'); if(l) l.scrollTop = l.scrollHeight; }
        window.switchChatMode = function(mode) { currentChatMode = mode; document.querySelectorAll('.chat-tab-btn').forEach(b => b.classList.remove('active-chat-tab')); document.getElementById(`chat-tab-${mode}`).classList.add('active-chat-tab'); if(mode === 'pm' && !activePmTargetNode) { document.getElementById('logs').innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-dim); font-size:12px;">Tap a user profile in Global to start a PM.</div>'; return; } loadChatStream(); };
        window.startPmWithUser = function(targetUser) { if(targetUser === getMyName()) return; activePmTargetNode = targetUser; document.getElementById('chat-tab-pm').innerText = `🔒 PM: ${targetUser}`; window.switchChatMode('pm'); };
        function loadChatStream() { const logs = document.getElementById('logs'); if(!logs) return; if(currentChatMode === 'global') { globalChatRef?.off(); globalChatRef?.limitToLast(40).on("value", function(snap) { renderPackets(snap, logs); }); } else { if(!activePmTargetNode) return; privateChatRef?.off(); privateChatRef?.limitToLast(40).on("value", function(snap) { renderPackets(snap, logs, true); }); } }
        function renderPackets(snap, targetElement, filterPm = false) { targetElement.innerHTML = ''; snap.forEach(function(child) { const d = child.val(); if(filterPm) { const combinedKey = [getMyName(), activePmTargetNode].sort().join("___"); if(d.pmKey !== combinedKey) return; } targetElement.innerHTML += `<div class="chat-bubble-row" onclick="window.startPmWithUser('${d.nickname}')"><img class="chat-user-avatar" src="${d.avatar || defaultAvatar}"><div class="chat-msg-container"><div class="chat-meta-header"><span class="badge-system badge-${d.badge}">${d.badge}</span><b>${d.nickname}</b></div><div class="chat-bubble-payload">${d.message}</div></div></div>`; }); scrollChat(); }

        const BANNED_WORDS = ["junrey teves", "junrey", "teves", "gago", "tanga", "bobo", "putangina", "puta", "pota", "pakyu", "fuck", "shit", "bitch", "ulol"];
        function filterAppropriateContent(text) { let filteredText = text; BANNED_WORDS.forEach(word => { let regex = new RegExp("\\b" + word + "\\b", "gi"); filteredText = filteredText.replace(regex, "*".repeat(word.length)); }); return filteredText; }

        window.sendMsg = function() {
            const m = document.getElementById('msg').value; if(!m.trim()) return; window.saveProfileSettings();
            const packet = { nickname: getMyName(), badge: localStorage.getItem('omniverse_badge') || "member", avatar: userAvatarBase64, message: filterAppropriateContent(sanitize(m)), timestamp: firebase.database.ServerValue.TIMESTAMP }; 
            if(currentChatMode === 'global') { globalChatRef.push(packet); } else { if(!activePmTargetNode) return; packet.pmKey = [getMyName(), activePmTargetNode].sort().join("___"); privateChatRef.push(packet); }
            document.getElementById('msg').value = "";
        };

        // ANIME CORE LOADER
        function initBannerSlider() { clearInterval(slideInterval); const track = document.getElementById('slider-track'); slideInterval = setInterval(() => { if (track && track.children.length > 0) { currentSlide = (currentSlide + 1) % track.children.length; track.style.transform = `translateX(-${currentSlide * 25}%)`; } }, 4000); }
        async function fetchDeepAnimeMetadata(animeId, delayTime) { try { await new Promise(r => setTimeout(r, delayTime)); const staffRes = await fetch(`https://api.jikan.moe/v4/anime/${animeId}/staff`), staffData = await staffRes.json(); let director = "Production Committee"; if(staffData.data) { const dObj = staffData.data.find(s => s.positions.some(p => p.toLowerCase().includes('director'))); if(dObj) director = dObj.person.name; } const charRes = await fetch(`https://api.jikan.moe/v4/anime/${animeId}/characters`), charData = await charRes.json(); let vaList = []; if(charData.data) { let count = 0; for(let c of charData.data) { const jaVa = c.voice_actors.find(va => va.language === 'Japanese'); if(jaVa) { vaList.push(jaVa.person.name); count++; } if(count >= 3) break; } } return { director, voiceActors: vaList.join(', ') || "TBA" }; } catch(e) { return { director: "TBA", voiceActors: "TBA" }; } }
        
        async function fetchData(query = '') { 
            try { 
                const topRes = await fetch('https://api.jikan.moe/v4/top/anime?limit=4'), topData = await topRes.json(); 
                const track = document.getElementById('slider-track'); 
                if(track && !query) { 
                    track.innerHTML = ''; 
                    topData.data.forEach(a => { track.innerHTML += `<div class="slide-frame"><img src="${a.images.jpg.large_image_url}"><div class="slide-gradient">${sanitize(a.title)}</div></div>`; }); 
                    initBannerSlider(); 
                } 
            } catch(e){} 
            try { 
                const uFeed = document.getElementById(query ? 'explore-feed' : 'upcoming-feed'); uFeed.innerHTML = '<div style="padding:20px; color:var(--accent); font-size:12px;">Syncing matrix nodes...</div>'; 
                const url = query ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}` : 'https://api.jikan.moe/v4/seasons/upcoming'; 
                const res = await fetch(url), data = await res.json(); uFeed.innerHTML = ''; 
                if(data.data) { 
                    let items = data.data.slice(0, 6); let dAcc = 0; 
                    items.forEach((item) => { 
                        const studio = item.studios?.[0]?.name || 'TBA'; const cardId = `deep-${item.mal_id}`; 
                        uFeed.innerHTML += `<div class="app-card"><div class="card-body-core"><div class="card-media-box"><img src="${item.images.jpg.image_url}"></div><div class="card-meta-pane"><h3>${sanitize(item.title)}</h3><div class="info-row"><b>Studio:</b> ${sanitize(studio)}</div><div class="info-row"><b>Source:</b> ${sanitize(item.source || 'Original')}</div></div></div><div class="deep-details-drawer" id="${cardId}"><div class="info-row"><b>Director:</b> Loading...</div></div><div class="card-footer-actions"><button class="btn-action-trigger" onclick="window.playVideo('${item.trailer?.url || ''}')">🎬 TRAILER</button><a class="btn-action-trigger" href="${item.url || '#'}" target="_blank">🔗 LINK</a></div></div>`; 
                        dAcc += 300; fetchDeepAnimeMetadata(item.mal_id, dAcc).then(extra => { const box = document.getElementById(cardId); if(box) { box.innerHTML = `<div class="info-row"><b>Director:</b> ${sanitize(extra.director)}</div><div class="info-row"><b>Cast:</b> <span class="va-text-highlight">${sanitize(extra.voiceActors)}</span></div>`; } }); 
                    }); 
                } 
            } catch(e){} 
            if(!query) { 
                try { 
                    const mFeed = document.getElementById('manga-feed'); const res = await fetch('https://api.jikan.moe/v4/top/manga?limit=6'), data = await res.json(); mFeed.innerHTML = ''; 
                    data.data.forEach(item => { mFeed.innerHTML += `<div class="app-card"><div class="card-body-core"><div class="card-media-box"><img src="${item.images.jpg.image_url}"></div><div class="card-meta-pane"><h3>${sanitize(item.title)}</h3><div class="info-row"><b>Author:</b> ${sanitize(item.authors?.[0]?.name || 'TBA')}</div></div></div><div class="card-footer-actions"><a class="btn-action-trigger" href="${item.url}" target="_blank" style="border-radius:0 0 16px 16px;">📖 ARCHIVE SPECS</a></div></div>`; }); 
                } catch(e){} 
            } 
        }

        window.playVideo = function(url) { if(!url) { alert("No official trailer found."); return; } let embed = url; if(url.includes("v=")) embed = `https://www.youtube.com/embed/${url.split("v=")[1].split("&")[0]}?autoplay=1`; else if(url.includes("youtu.be/")) embed = `https://www.youtube.com/embed/${url.split("youtu.be/")[1].split("?")[0]}?autoplay=1`; document.getElementById('videoIframe').src = embed; document.getElementById('videoModal').style.display = 'flex'; }; window.closeVideo = function() { document.getElementById('videoModal').style.display = 'none'; document.getElementById('videoIframe').src = ''; };
        if(localStorage.getItem('omniverse_nick')) document.getElementById('nick').value = localStorage.getItem('omniverse_nick'); if(localStorage.getItem('omniverse_badge')) document.getElementById('userBadge').value = localStorage.getItem('omniverse_badge'); if(localStorage.getItem('omniverse_avatar')) { userAvatarBase64 = localStorage.getItem('omniverse_avatar'); document.getElementById('avatarPreview').src = userAvatarBase64; }
        window.saveProfileSettings = function() { localStorage.setItem('omniverse_nick', sanitize(document.getElementById('nick').value) || "Guest Node"); localStorage.setItem('omniverse_badge', document.getElementById('userBadge').value || "member"); }; document.getElementById('fileInput').addEventListener('change', function(e) { const file = e.target.files[0]; if (file && file.size <= 300000) { const reader = new FileReader(); reader.onload = function(evt) { userAvatarBase64 = evt.target.result; document.getElementById('avatarPreview').src = userAvatarBase64; localStorage.setItem('omniverse_avatar', userAvatarBase64); }; reader.readAsDataURL(file); } });
        window.search = function() { const q = document.getElementById('searchInput').value; if(q.trim()) { window.switchAppView('explore'); fetchData(q); } };
        
        window.onload = function() { 
            try { 
                const config = { databaseURL: "https://studio-8164628274-c414a-default-rtdb.asia-southeast1.firebasedatabase.app/" }; 
                firebase.initializeApp(config); 
                globalChatRef = firebase.database().ref("chat_messages"); 
                privateChatRef = firebase.database().ref("private_messages"); 
                loadChatStream(); 
            } catch(e){} 
            fetchData(); 
            window.searchMusicDatabase(); // Agad nitong lo-load-in ang default search para hindi maging blangko!
        };
    </script>
</body>
</html>
