<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="google-site-verification" content="s1LpdFQDsO-k3mGLHAsP62N2V955khk8kZsyeon9G1M" />
    <title>OMNIVERSE | The Global Anime & Manga Authority</title>

    <style>
        :root { --bg: #0D0D0D; --panel: #1A1A1A; --text: #FFFFFF; --accent: #E74C3C; --sub: #888888; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 🔱 HEADER & SEARCH */
        header { background: var(--panel); padding: 12px; border-bottom: 2px solid var(--accent); z-index: 100; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        header h1 { font-size: 22px; color: var(--accent); letter-spacing: 3px; font-weight: 900; text-transform: uppercase; }
        .search-engine { width: 100%; background: #000; border: 1px solid var(--sub); border-radius: 20px; padding: 10px 15px; color: white; outline: none; font-size: 14px; }

        /* 🔱 AUTO-SWIPE BANNER */
        .banner { width: 100%; height: 140px; background: #000; overflow: hidden; position: relative; }
        .banner-track { display: flex; animation: swipe 15s infinite; width: 400%; }
        .banner-track img { width: 25%; height: 140px; object-fit: cover; opacity: 0.6; }
        @keyframes swipe { 0%, 20% { transform: translateX(0); } 25%, 45% { transform: translateX(-25%); } 50%, 70% { transform: translateX(-50%); } 75%, 95% { transform: translateX(-75%); } 100% { transform: translateX(0); } }

        /* 🔱 VIDEO TRAILER SECTION */
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 1px solid var(--accent); }
        iframe { width: 100%; height: 100%; border: none; }

        /* 🔱 ADS SLOT */
        .ad-banner { background: #111; padding: 10px; text-align: center; font-size: 10px; color: var(--sub); border-bottom: 1px solid #333; text-transform: uppercase; letter-spacing: 2px; }

        /* 🔱 CONTENT FEED (AUTO-UPDATED) */
        .main-feed { flex: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .card { background: var(--panel); border-radius: 15px; margin-bottom: 20px; overflow: hidden; border: 1px solid #333; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-info { padding: 15px; }
        .tag { color: var(--accent); font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 8px; line-height: 1.2; }
        .details { font-size: 12px; color: var(--sub); line-height: 1.6; }
        .meta-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; font-size: 11px; color: #aaa; }

        /* 🔱 CHAT SYSTEM */
        .chat-ui { background: var(--panel); border-top: 2px solid var(--accent); padding: 10px; }
        #logs { height: 60px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; scroll-behavior: smooth; }
        .controls { display: flex; gap: 5px; }
        .nick-box { width: 70px; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 12px; padding: 8px; text-align: center; font-weight: bold; font-size: 11px; outline: none; }
        .msg-box { flex: 1; background: #222; border: 1px solid #444; color: white; border-radius: 12px; padding: 8px 15px; outline: none; font-size: 13px; }
        .send-btn { background: var(--accent); border: none; color: white; padding: 0 15px; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="top-nav">
            <h1>OMNIVERSE</h1>
            <button onclick="document.body.classList.toggle('light-mode')" style="background:none; border:1px solid var(--accent); color:var(--accent); border-radius:10px; font-size:10px; padding:2px 8px;">MODE</button>
        </div>
        <input type="text" class="search-engine" placeholder="Search Anime, Manga, Voice Actors, Studios...">
    </header>

    <div class="banner">
        <div class="banner-track">
            <img src="https://images.unsplash.com/photo-1541876072-be623c44fc47?w=800" alt="Highlight 1">
            <img src="https://images.unsplash.com/photo-1578632738908-4521c726eec6?w=800" alt="Highlight 2">
            <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=800" alt="Highlight 3">
            <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=800" alt="Highlight 4">
        </div>
    </div>

    <div class="video-box">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>

    <div class="ad-banner">Google AdSense Space • Revenue Partner</div>

    <div class="main-feed" id="omniverse-feed">
        <div style="text-align:center; padding:40px; color:var(--sub);">Connecting to Global Omniverse Database...</div>
    </div>

    <div class="chat-ui">
        <div id="logs"><b>System:</b> Omniverse Verified. Database is Live.</div>
        <div class="controls">
            <input type="text" id="nick" class="nick-box" placeholder="NICK" value="Boss">
            <input type="text" id="msg" class="msg-box" placeholder="Type message...">
            <button class="send-btn" onclick="chat()">SEND</button>
        </div>
    </div>

    <script>
        // 🔱 NICKNAME CHAT ENGINE
        function chat() {
            const n = document.getElementById('nick').value || "Guest";
            const m = document.getElementById('msg').value;
            if(m) {
                document.getElementById('logs').innerHTML += `<div><b style="color:#E74C3C">${n}:</b> ${m}</div>`;
                document.getElementById('msg').value = "";
                document.getElementById('logs').scrollTop = document.getElementById('logs').scrollHeight;
            }
        }

        // 🔱 GLOBAL DATA FETCH (Anime, Manga, Authors, Studios, Upcoming)
        async function loadOmniverseData() {
            try {
                // Hihigop ng Top Anime at Manga data
                const response = await fetch('https://api.jikan.moe/v4/top/anime');
                const data = await response.json();
                const container = document.getElementById('omniverse-feed');
                container.innerHTML = ''; 

                data.data.slice(0, 15).forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${item.images.jpg.large_image_url}" alt="Cover">
                            <div class="card-info">
                                <span class="tag">${item.type} • ${item.status}</span>
                                <h3 class="title">${item.title}</h3>
                                <div class="details">
                                    <b>Studios:</b> ${item.studios.map(s => s.name).join(', ') || 'N/A'}<br>
                                    <b>Rating:</b> ${item.score || 'N/A'} | <b>Rank:</b> #${item.rank}<br>
                                    <b>Episodes:</b> ${item.episodes || 'Ongoing'}
                                </div>
                                <div class="meta-box">
                                    <b>Info:</b> ${item.synopsis ? item.synopsis.substring(0, 100) + '...' : 'Global data loading...'}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) { console.log("Database Sync Error."); }
        }
        loadOmniverseData();
    </script>
</body>
</html>
