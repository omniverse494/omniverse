<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="s1LpdFQDsO-k3mGLHAsP62N2V955khk8kZsyeon9G1M" />
    <title>OMNIVERSE APEX | Global Authority</title>

    <style>
        :root { --bg: #0D0D0D; --panel: #1A1A1A; --text: #FFFFFF; --accent: #E74C3C; --sub: #888888; }
        .light-mode { --bg: #F0F2F5; --panel: #FFFFFF; --text: #1C1E21; --accent: #E74C3C; --sub: #606770; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* 🔱 HEADER & SEARCH */
        header { background: var(--panel); padding: 10px 15px; border-bottom: 3px solid var(--accent); z-index: 1000; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        header h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); font-weight: 900; }
        
        .search-box { display: flex; background: var(--bg); border-radius: 20px; padding: 5px 15px; border: 1px solid var(--sub); }
        .search-box input { background: none; border: none; color: var(--text); outline: none; width: 100%; font-size: 14px; }

        /* 🔱 CONTENT */
        .content { flex: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .card { background: var(--panel); border-radius: 15px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 12px; }
        .tag { font-size: 10px; color: var(--accent); font-weight: bold; text-transform: uppercase; }

        /* 🔱 CHAT WITH NICKNAME */
        .chat-section { background: var(--panel); border-top: 1px solid var(--sub); padding: 10px; }
        #chat-box { height: 100px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; background: rgba(0,0,0,0.1); padding: 5px; }
        
        .chat-controls { display: grid; grid-template-columns: 80px 1fr auto; gap: 5px; }
        .nick-input { background: var(--bg); border: 1px solid var(--accent); color: var(--accent); border-radius: 15px; padding: 5px 10px; font-size: 12px; text-align: center; font-weight: bold; outline: none; }
        .msg-input { background: var(--bg); border: 1px solid var(--sub); color: var(--text); border-radius: 15px; padding: 5px 15px; outline: none; }
        .btn-send { background: var(--accent); border: none; color: white; padding: 5px 15px; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <h1>Omniverse Apex</h1>
            <button style="background:none; border:1px solid var(--accent); color:var(--accent); font-size:10px; border-radius:10px; padding:2px 8px;" onclick="document.body.classList.toggle('light-mode')">MODE</button>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search Anime, Manga, News...">
        </div>
    </header>

    <div class="content">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1541876072-be623c44fc47?w=600" alt="News">
            <div class="card-body">
                <span class="tag">System Update</span>
                <div style="font-weight:bold; margin-top:5px;">Search & Nickname System Integrated</div>
                <div style="font-size:12px; color:var(--sub);">Omniverse Engine v2.0 is now live.</div>
            </div>
        </div>
    </div>

    <div class="chat-section">
        <div id="chat-box">
            <div style="margin-bottom:5px;"><b style="color:var(--accent)">System:</b> Welcome! Set your Nickname below.</div>
        </div>
        <div class="chat-controls">
            <input type="text" id="nick" class="nick-input" placeholder="NICK" maxlength="8">
            <input type="text" id="msg" class="msg-input" placeholder="Type message...">
            <button class="btn-send" onclick="send()">SEND</button>
        </div>
    </div>

    <script>
        function send() {
            const nick = document.getElementById('nick').value || "Guest";
            const msg = document.getElementById('msg').value;
            const box = document.getElementById('chat-box');
            if(msg.trim() !== "") {
                box.innerHTML += `<div><b style="color:var(--accent)">${nick}:</b> ${msg}</div>`;
                document.getElementById('msg').value = "";
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
</body>
</html>
