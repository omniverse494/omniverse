<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Omniverse - Anime, Manga, and Manhwa Database Dashboard.">
    <meta name="google-site-verification" content="s1LpdFQDsO-k3mGLHAsP62N2V955khk8kZsyeon9G1M" />
    <title>OMNIVERSE</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8691102556824057" crossorigin="anonymous"></script>
    
    <style>
        /* CSS VARIABLES FOR SEAMLESS WHITE/BLACK TOGGLE */
        :root { 
            --bg: #0d0d0d; 
            --panel: #161616; 
            --accent: #FF4500; 
            --text: #FFF; 
            --sub: #aaaaaa; 
            --border: #262626;
            --input-bg: #000;
            --input-text: #FFF;
            --banner-filter: brightness(0.5);
        }
        .light-mode { 
            --bg: #F5F5F5; 
            --panel: #FFF; 
            --accent: #E74C3C; 
            --text: #111; 
            --sub: #555555; 
            --border: #DDD;
            --input-bg: #EAEAEA;
            --input-text: #111;
            --banner-filter: brightness(0.75);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s, border-color 0.2s; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* HEADER & SEARCH BAR */
        header { padding: 15px 20px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        header h1 { font-size: 20px; color: var(--text); letter-spacing: 2px; font-weight: 800; }
        header h1 span { color: var(--accent); }
        
        .search-area { flex: 1; display: flex; max-width: 500px; }
        .search-area input { width: 100%; padding: 10px 15px; background: var(--input-bg); border: 1px solid var(--border); color: var(--input-text); border-radius: 4px 0 0 4px; outline: none; font-size: 14px; }
        .search-area button { background: var(--accent); border: none; padding: 0 20px; color: white; font-weight: 600; border-radius: 0 4px 4px 0; cursor: pointer; }
        
        /* THEME TOGGLE BUTTON */
        .theme-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 15px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; text-transform: uppercase; }
        .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* DYNAMIC AUTO-SWIPE BANNER */
        .banner { width: 100%; height: 320px; overflow: hidden; position: relative; border-bottom: 1px solid var(--border); background: #111; }
        .banner-track { display: flex; width: 400%; height: 100%; animation: slide 16s infinite; }
        .banner-track .slide { width: 25%; height: 100%; position: relative; background: #111; }
        .banner-track img { width: 100%; height: 100%; object-fit: cover; filter: var(--banner-filter); display: block; }
        
        @keyframes slide { 
            0%, 20% { transform: translateX(0); } 
            25%, 45% { transform: translateX(-25%); } 
            50%, 70% { transform: translateX(-50%); } 
            75%, 95% { transform: translateX(-75%); } 
        }
        
        .banner-text { position: absolute; bottom: 20px; left: 20px; z-index: 10; pointer-events: none; max-width: 80%; }
        .banner-text h2 { font-size: 28px; font-weight: 800; color: #FFF; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        .banner-text p { font-size: 14px; color: #FF4500; font-weight: bold; text-shadow: 0 1px 5px rgba(0,0,0,0.9); margin-top: 5px; }

        /* RESPONSIVE LAYOUT DESIGN */
        .main-grid { display: flex; flex-direction: row; flex-wrap: wrap; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; }
        .content { flex: 2.5; min-width: 320px; }
        .side { flex: 1; min-width: 300px; }

        .label { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; margin: 20px 0 12px; letter-spacing: 1px; display: block; border-left: 3px solid var(--accent); padding-left: 8px; }

        /* DATA CARDS WITH INTERACTIVE LINKS */
        .card { display: flex; gap: 15px; background: var(--panel); padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid var(--border); text-decoration: none; color: inherit; }
        .card:hover { border-color: var(--accent); }
        .card img { width: 95px; height: 135px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }
        .details { flex: 1; }
        .details h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
        .meta { font-size: 12px; color: var(--sub); line-height: 1.5; margin-bottom: 10px; }
        .meta b { color: var(--text); }
        .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        
        .btn-portal { font-size: 11px; padding: 6px 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 4px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
        .btn-portal:hover { border-color: var(--accent); color: var(--accent); }

        /* LIVE CHAT INTERFACE */
        .nexus { background: var(--panel); border: 1px solid var(--border); height: 350px; display: flex; flex-direction: column; border-radius: 6px; overflow: hidden; }
        #logs { flex: 1; padding: 15px; overflow-y: auto; font-size: 13px; line-height: 1.5; color: var(--text); background: var(--panel); }
        .ui { padding: 12px; background: var(--input-bg); border-top: 1px solid var(--border); }
        .nick-in { width: 100%; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); color: var(--accent); border-radius: 4px; font-weight: 600; margin-bottom: 8px; outline: none; font-size: 12px; }
        .msg-row { display: flex; gap: 8px; }
        .msg-row input { flex: 1; padding: 10px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px; outline: none; font-size: 13px; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 0 15px; border-radius: 4px; font-weight: 600; cursor: pointer; }

        /* LIVE NEWS PANEL */
        .news-section { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-top: 20px; }
        .news-grid { display: flex; flex-direction: column; gap: 15px; }
        .news-item { border-bottom: 1px dashed var(--border); padding-bottom: 12px; font-size: 13px; color: var(--sub); }
        .news-item:last-child { border: none; padding-bottom: 0; }
        .news-item b { color: var(--text); display: block; margin-bottom: 4px; font-size: 14px; text-decoration: none; }
        .news-item b a { color: inherit; text-decoration: none; }
        .news-item b a:hover { color: var(--accent); }
        .news-meta { font-size: 11px; color: var(--accent); margin-top: 4px; display: block; font-weight: 600; }

        /* AUTOMATED ADS CONTAINER */
        .ads-slot { display: block; width: 100%; min-height: 10px; margin-bottom: 15px; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
            header h1 { text-align: center; font-size: 18px; }
            .search-area { max-width: 100%; }
            .theme-btn { width: 100%; text-align: center; }
            .banner { height: 180px; }
            .banner-text h2 { font-size: 18px; bottom: 10px; left: 10px; }
            .main-grid { flex-direction: column; padding: 10px; gap: 15px; }
            .card { padding: 12px; gap: 12px; }
            .card img { width: 80px; height: 115px; }
            .details h3 { font-size: 14px; }
            .meta { font-size: 11px; }
            .btn-portal { font-size: 10px; padding: 5px 8px; }
            .nexus { height: 300px; }
        }
    </style>
</head>
<body>

<header>
    <h1>OMNI<span>VERSE</span></h1>
    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Search Anime, Manga, Manhwa..." onkeydown="if(event.key === 'Enter') search()">
        <button onclick="search()">Search</button>
    </div>
    <button class="theme-btn" onclick="document.body.classList.toggle('light-mode')">Theme</button>
</header>

<!-- BANNER SYSTEM GENERATED VIA API -->
<div class="banner">
    <div class="banner-track" id="banner-track">
        <!-- Titirahan ng mga dynamic anime images galing sa API -->
        <div class="slide"><div style="padding:100px; color:white; text-align:center;">Loading Hot Releases...</div></div>
    </div>
    <div class="banner-text">
        <h2 id="banner-title">Trending Spotlight</h2>
        <p id="banner-sub">Auto-Updating Global Feed</p>
    </div>
</div>

<div class="main-grid">
    <div class="content">
        <div class="ads-slot">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="fluid"
                 data-ad-layout-key="-fb+5w+4e-db+86"
                 data-ad-client="ca-pub-8691102556824057"
                 data-ad-slot="auto"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
        
        <span class="label" id="feed-label-1">Upcoming Anime & Trailers</span>
        <div id="upcoming-feed"></div>
        
        <span class="label" id="feed-label-2">Top Manga, Manhwa, & Manhua</span>
        <div id="manga-feed"></div>
    </div>

    <div class="side">
        <span class="label">Community Chat</span>
        <div class="nexus">
            <div id="logs"></div>
            <div class="ui">
                <input type="text" id="nick" class="nick-in" placeholder="Set Nickname..." value="User">
                <div class="msg-row">
                    <input type="text" id="msg" placeholder="Type a message and press enter..." onkeydown="if(event.key === 'Enter') send()">
                    <button class="send-btn" onclick="send()">Send</button>
                </div>
            </div>
        </div>
        
        <span class="label">Live Industry Logs & Episode Updates</span>
        <div class="news-section">
            <div id="news-feed" class="news-grid">
                <div style="color:var(--sub); font-size:12px;">Fetching latest industry logs...</div>
            </div>
        </div>
    </div>
</div>

<script>
    function send() {
        const n = document.getElementById('nick').value || "Guest";
        const m = document.getElementById('msg').value;
        const l = document.getElementById('logs');
        if(m) {
            l.innerHTML += `<div><b style="color:var(--accent)">${n}:</b> ${m}</div>`;
            document.getElementById('msg').value = "";
            l.scrollTop = l.scrollHeight;
        }
    }

    // Awtomatikong pag-load ng lahat ng data
    async function fetchData(q = '') {
        try {
            // 1. DYNAMIC BANNER IMAGES (Kukuha ng 4 na kasalukuyang sikat na Anime para sa auto-swipe)
            const topAnimeRes = await fetch('https://api.jikan.moe/v4/top/anime?filter=bypopularity');
            const topAnimeData = await topAnimeRes.json();
            if(topAnimeData.data && topAnimeData.data.length >= 4) {
                const bannerTrack = document.getElementById('banner-track');
                bannerTrack.innerHTML = '';
                // Kumuha ng top 4 para sa 4 slider sections mo
                topAnimeData.data.slice(0, 4).forEach(anime => {
                    // Ginagamit ang malaking image ng Anime bilang background image ng slide
                    const imgUrl = anime.images.jpg.large_image_url;
                    bannerTrack.innerHTML += `
                        <div class="slide">
                            <img src="${imgUrl}" alt="${anime.title}" style="object-position: 50% 20%;">
                        </div>`;
                });
            }

            // 2. UPCOMING ANIME & SEARCH FEED
            const api = q ? `https://api.jikan.moe/v4/anime?q=${q}` : 'https://api.jikan.moe/v4/seasons/upcoming';
            const res = await fetch(api);
            const data = await res.json();
            const uFeed = document.getElementById('upcoming-feed');
            uFeed.innerHTML = '';

            if(q) {
                document.getElementById('feed-label-1').innerText = `Search Results for: ${q}`;
            } else {
                document.getElementById('feed-label-1').innerText = "Upcoming Anime & Trailers";
            }

            data.data.slice(0, 10).forEach(item => {
                const infoLink = item.url; 
                const trailerLink = item.trailer?.url || "https://www.youtube.com";
                const studioName = item.studios && item.studios[0] ? item.studios[0].name : 'TBA';

                uFeed.innerHTML += `
                    <div class="card">
                        <img src="${item.images.jpg.large_image_url}" alt="Cover">
                        <div class="details">
                            <h3>${item.title}</h3>
                            <div class="meta">
                                <b>Studio:</b> ${studioName}<br>
                                <b>Source:</b> ${item.source || 'N/A'} | <b>Score:</b> ⭐ ${item.score || 'TBA'}<br>
                                <b>Type:</b> ${item.type || 'TV'} | <b>Episodes:</b> ${item.episodes || 'TBA'}<br>
                                <b>Status:</b> ${item.status}
                            </div>
                            <div class="links">
                                <a href="${infoLink}" target="_blank" class="btn-portal">📺 Official Database Info</a>
                                <a href="${trailerLink}" target="_blank" class="btn-portal">🎬 Play Trailer</a>
                            </div>
                        </div>
                    </div>`;
            });

            // 3. MANGA, MANHWA, MANHUA FEED
            if(!q) {
                const mRes = await fetch('https://api.jikan.moe/v4/top/manga');
                const mData = await mRes.json();
                const mFeed = document.getElementById('manga-feed');
                mFeed.innerHTML = '';
                
                mData.data.slice(0, 10).forEach(item => {
                    const authorName = item.authors && item.authors[0] ? item.authors[0].name : 'N/A';
                    uFeed.innerHTML ? mFeed.innerHTML += `
                        <div class="card">
                            <img src="${item.images.jpg.large_image_url}" alt="Cover">
                            <div class="details">
                                <h3>${item.title}</h3>
                                <div class="meta">
                                    <b>Author/Artist:</b> ${authorName}<br>
                                    <b>Type:</b> ${item.type} (Manhwa/Manga/Manhua)<br>
                                    <b>Rank:</b> #${item.rank} | <b>Chapters:</b> ${item.chapters || 'Ongoing'}<br>
                                    <b>Score:</b> ⭐ ${item.score}
                                </div>
                                <div class="links">
                                    <a href="${item.url}" target="_blank" class="btn-portal">📖 View Official Info</a>
                                </div>
                            </div>
                        </div>` : '';
                });

                // 4. AUTOMATED LIVE NEWS (Pinakabagong sikat na episodes na kalalabas lang)
                const newsRes = await fetch('https://api.jikan.moe/v4/watch/episodes/popular');
                const newsData = await newsRes.json();
                const newsFeed = document.getElementById('news-feed');
                newsFeed.innerHTML = '';
                
                newsData.data.slice(0, 5).forEach(news => {
                    newsFeed.innerHTML += `
                        <div class="news-item">
                            <b><a href="${news.entry.url}" target="_blank">📣 New Episode Update: ${news.entry.title}</a></b>
                            The latest global broadcast logs and licensed streaming tracks have updated.
                            <span class="news-meta">Click to track full legal source info</span>
                        </div>`;
                });
            }
        } catch (e) { 
            console.log("Network sync delay:", e); 
            document.getElementById('news-feed').innerHTML = '<div style="color:red; font-size:12px;">News network temporarily busy. Reload.</div>';
        }
    }

    function search() {
        const q = document.getElementById('searchInput').value;
        if(q) fetchData(q);
    }

    // Unang takbo ng app para kumuha ng live data
    fetchData();
</script>
</body>
</html>
